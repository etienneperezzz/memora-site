<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memorizzz</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/retro.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/chats.css">
</head>
<body>
<script>window.MEMORA_DEMO=true;</script>
<div id="app">

  <!-- TABS -->
  <div class="tabs">
    <div class="tabs-row" id="tabs-row">
      <div class="tab active" data-tab="0" data-source="memories">Souvenirs</div>
      <div class="tab" data-tab="4" data-source="chat" data-view="chats">Chats</div>
      <div class="tab" data-tab="1" data-source="chat">Chat Media</div>
      <div class="tab" data-tab="2" data-source="memories" data-view="map">Carte</div>
      <button class="refresh-btn" id="add-btn" title="Ajouter un export Snapchat" aria-label="Ajouter des données" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="refresh-btn" id="random-btn" title="Souvenir aléatoire" aria-label="Aléatoire">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3"/>
          <circle cx="8"  cy="8"  r="1.2" fill="currentColor"/>
          <circle cx="16" cy="8"  r="1.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="8"  cy="16" r="1.2" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </button>
      <button class="refresh-btn" id="refresh-btn" title="Actualiser les souvenirs" aria-label="Actualiser">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
      <button class="refresh-btn" id="settings-btn" title="Réglages" aria-label="Réglages" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="tab-indicator" id="tab-indicator"></div>
  </div>

  <!-- TAB CAPTION (demo only) -->
  <div id="tab-caption"></div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-inner">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input"
             placeholder="Rechercher dans les souvenirs…"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <!-- Chat Media filters (grid.js buildChatFilters) -->
    <div class="cm-filters" id="cm-filters" hidden></div>
  </div>

  <!-- MES SOUVENIRS: grid | stats switch (like a conversation's Messages | Stats) -->
  <div class="mem-seg" id="mem-seg" style="display:none">
    <div class="ch-seg" role="tablist">
      <button data-memview="list" class="on">Souvenirs</button>
      <button data-memview="stats">Stats</button>
    </div>
  </div>

  <!-- TIMELINE scrubber (year/month navigation, replaces the filter chips) -->
  <div class="scrubber" id="scrubber" hidden></div>
  <div class="sc-bubble" id="sc-bubble"></div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <!-- SOUVENIRS carousel (flashbacks / voyages / au hasard / rétro) -->
    <div class="souvenirs" id="souvenirs" hidden></div>
    <div id="main-content">
      <div class="state-view">
        <div class="spinner"></div>
        <span>Chargement des souvenirs…</span>
      </div>
    </div>
    <div id="map-view" style="display:none"><div id="map-hud">Chargement de la carte…</div></div>
    <div id="stats-view" style="display:none"></div>
    <div id="chats-view" style="display:none"></div>
  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="lb-bg"></div>
  <div class="lb-header">
    <button class="lb-close" id="lb-close" aria-label="Fermer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="lb-date" id="lb-date"></div>
    <div class="lb-right">
      <label class="lb-auto" title="Raccourci : espace">Défilement auto<input type="checkbox" id="lb-play" role="switch"></label>
      <div class="lb-more">
        <button class="lb-close" id="lb-more" aria-label="Plus d'options" aria-haspopup="menu" aria-expanded="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="lb-menu" id="lb-menu" role="menu" hidden>
          <button role="menuitem" id="lb-info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span id="lb-info-label">Informations</span></button>
          <button role="menuitem" id="lb-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Partager</button>
          <button role="menuitem" id="lb-copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copier l'image</button>
          <button role="menuitem" id="lb-dl"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>Télécharger</button>
          <button role="menuitem" id="lb-reveal"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Afficher dans le dossier</button>
          <button role="menuitem" id="lb-goconv" hidden><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Voir dans la conversation</button>
        </div>
      </div>
    </div>
  </div>
  <div class="lb-media-wrap" id="lb-wrap">
    <div class="lb-slide" id="lb-slide"></div>
  </div>
  <!-- nav arrows -->
  <button class="lb-nav lb-nav-prev" id="lb-prev" aria-label="Précédent">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
  <button class="lb-nav lb-nav-next" id="lb-next" aria-label="Suivant">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>

  <!-- Informations (⋯ menu): time, place, who sent it -->
  <div class="lb-meta" id="lb-meta">
    <div class="lb-meta-row" id="lb-time" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="lb-time-text"></span>
    </div>
    <div class="lb-meta-row" id="lb-loc" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <a id="lb-loc-link" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="lb-meta-row" id="lb-who" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span id="lb-who-text"></span>
      <a id="lb-who-link" href="#" class="lb-who-link">Voir dans la conversation</a>
    </div>
  </div>
</div>

<!-- SELECTION BAR -->
<div id="sel-bar">
  <div class="sel-count" id="sel-count">0 sélectionné</div>
  <div class="sel-actions">
    <div class="sel-btn" id="sel-dl">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Exporter</span>
    </div>
    <div class="sel-btn" id="sel-share">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span>Partager</span>
    </div>
    <div class="sel-btn" id="sel-demo" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M3 12h18"/>
      </svg>
      <span>Démo</span>
    </div>
    <div class="sel-btn" id="sel-cancel">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
      <span>Annuler</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/supercluster@8.0.1/dist/supercluster.min.js"></script>
<!-- App scripts: plain scripts sharing one global scope, loaded in this order -->
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/voice.js"></script>
<script src="js/tabs.js"></script>
<script src="js/grid.js"></script>
<script src="js/souvenirs.js"></script>
<script src="js/scrubber.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/map.js"></script>
<script src="js/retro.js"></script>
<script src="js/chats.js"></script>
<script src="js/main.js"></script>
<script src="js/license.js"></script>
<script src="js/settings.js"></script>
<script src="js/importer.js"></script>
<script src="js/update.js"></script>
</body>
</html>
