<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Souvenirs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0d0d;
  --bg2:#1c1c1c;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.5);
  --accent:#FFFC00;
  --gap:2px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,'SF Pro Text','Inter','Helvetica Neue',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── App shell ── */
#app{
  height:100vh;
  max-width:600px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* ── Tabs ── */
.tabs{
  position:relative;
  background:rgba(13,13,13,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding-top:max(14px,var(--safe-top));
  flex-shrink:0;
  z-index:50;
}
.tabs-row{
  display:flex;
  position:relative;
  align-items:center;
}
.refresh-btn{
  flex-shrink:0;
  width:34px;height:34px;
  margin-right:6px;margin-bottom:10px;
  border:none;background:none;
  color:rgba(255,255,255,0.45);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  transition:color 200ms,background 200ms;
  -webkit-tap-highlight-color:transparent;
}
.refresh-btn:hover{color:#fff;background:rgba(255,255,255,0.1)}
.refresh-btn.spinning svg{animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab{
  flex:1;
  text-align:center;
  padding:0 4px 12px;
  font-size:14px;
  font-weight:500;
  color:rgba(255,255,255,0.42);
  cursor:pointer;
  transition:color 250ms ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  letter-spacing:-0.01em;
}
.tab.active{color:#fff}
.tab-indicator{
  position:absolute;
  bottom:0;
  height:2px;
  background:#fff;
  border-radius:1px 1px 0 0;
  transition:transform 300ms cubic-bezier(0.4,0,0.2,1),
             width 300ms cubic-bezier(0.4,0,0.2,1);
  transform-origin:left center;
  pointer-events:none;
}
/* one-line description of the active tab — shown only in the web demo */
#tab-caption{display:none}
#app.demo #tab-caption{display:block;padding:9px 16px 3px;font-size:12.5px;
  color:rgba(255,255,255,0.55);text-align:center;line-height:1.45;background:var(--bg)}

/* ── Search ── */
.search-wrap{
  padding:8px 14px 10px;
  background:var(--bg);
  flex-shrink:0;
}
.search-inner{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.11);
  border-radius:999px;
  height:38px;
  padding:0 14px;
  transition:background 180ms ease;
}
.search-inner:focus-within{background:rgba(255,255,255,0.18)}
.search-icon{color:rgba(255,255,255,0.55);flex-shrink:0}
.search-inner input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:#fff;
  font-size:14px;
  font-family:inherit;
}
.search-inner input::placeholder{color:rgba(255,255,255,0.42)}

/* ── Filter chips (year / month) ── */
.filter-bar{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:0 0 9px;
  background:var(--bg);
  flex-shrink:0;
}
.chip-row{
  display:flex;
  gap:7px;
  padding:0 14px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;
  padding:6px 14px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,0.11);
  color:rgba(255,255,255,0.72);
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  letter-spacing:-0.01em;
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background 150ms ease,color 150ms ease,transform 120ms ease;
}
.chip:hover{background:rgba(255,255,255,0.18)}
.chip:active{transform:scale(0.94)}
.chip.active{background:var(--accent);color:#111}

/* ── Scrollable content ── */
.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.content::-webkit-scrollbar{width:0}

/* ── Stories ── */
.stories-section{
  padding:10px 0 8px 10px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  display:flex;
  gap:9px;
  scrollbar-width:none;
}
.stories-section::-webkit-scrollbar{display:none}

.story-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.story-ring{
  width:70px;height:70px;
  border-radius:50%;
  padding:2.5px;
  background:linear-gradient(135deg,#f9c34f 0%,#f97316 45%,#ec4899 100%);
  transition:transform 140ms ease;
}
.story-item:active .story-ring{transform:scale(0.91)}
.story-inner{
  width:100%;height:100%;
  border-radius:50%;
  border:2.5px solid var(--bg);
  overflow:hidden;
  background:var(--bg2);
}
.story-inner img{width:100%;height:100%;object-fit:cover;display:block}
.story-label{
  font-size:11px;
  color:var(--text);
  text-align:center;
  width:70px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ── Date groups ── */
.date-label{
  padding:7px 12px 4px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.065em;
  color:rgba(255,255,255,0.65);
  text-transform:uppercase;
  position:sticky;
  top:0;
  background:rgba(13,13,13,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:5;
}

/* ── Media grid ── */
.media-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  padding:0 var(--gap) var(--gap);
}

/* Day-groups are virtualized in JS (see virtualize()): only grids near the
   viewport hold their cells; the rest are empty with a reserved min-height, so
   the DOM stays small (hundreds of nodes, not 20k+) and scrolling is native. */

.media-cell{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:var(--bg2);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform 120ms ease,outline 100ms ease;
  outline:2.5px solid transparent;
  outline-offset:-2.5px;
}
.media-cell.selected{outline-color:#fff}
.media-cell.tap-flash{transform:scale(0.96) translateY(0)!important}

.media-cell img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.video-badge{
  position:absolute;
  bottom:6px;right:7px;
  pointer-events:none;
}
.audio-cell{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5b57d6,#8a56d6);
}
.audio-cell .audio-icon{
  width:42%;height:42%;color:rgba(255,255,255,0.92);
}
.audio-player{
  display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:26px;
}
.audio-player .audio-icon{
  width:84px;height:84px;color:#fff;opacity:0.92;
}
.check-circle{
  position:absolute;
  top:7px;right:7px;
  width:22px;height:22px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.75);
  background:rgba(0,0,0,0.25);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 150ms,background 150ms,border-color 150ms;
  pointer-events:none;
}
.selecting .check-circle{opacity:1}
.media-cell.selected .check-circle{background:#fff;border-color:#fff}

/* ── Lightbox ── */
#lightbox{
  position:fixed;inset:0;
  z-index:999;
  background:#000;
  display:none;
  flex-direction:column;
  user-select:none;
}
#lightbox.opening,#lightbox.open{display:flex}

.lb-bg{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  transition:opacity 250ms ease;
}
#lightbox.open .lb-bg{opacity:1}

.lb-header{
  position:absolute;
  top:0;left:0;right:0;
  z-index:10;
  padding:max(18px,var(--safe-top)) 16px 24px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);
  display:flex;align-items:center;justify-content:space-between;
  opacity:0;
  transition:opacity 220ms ease;
  pointer-events:none;
}
#lightbox.open .lb-header{opacity:1;pointer-events:auto}

.lb-close{
  width:38px;height:38px;
  border-radius:50%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  border:none;color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.lb-date{
  font-size:13px;
  color:rgba(255,255,255,0.78);
  font-weight:500;
}

.lb-media-wrap{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
  touch-action:none;
}
.lb-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  will-change:transform;
}
.lb-slide img,.lb-slide video{
  max-width:100%;max-height:100%;
  object-fit:contain;
  transform:scale(0.88);
  opacity:0;
  transition:transform 260ms cubic-bezier(0.16,1,0.3,1),opacity 220ms ease;
  display:block;
}
.lb-slide.loaded img,.lb-slide.loaded video{transform:scale(1);opacity:1}

/* meta panel: time + location, above footer */
.lb-meta{
  position:absolute;
  bottom:80px;left:0;right:0;
  z-index:10;
  padding:0 18px 6px;
  display:flex;flex-direction:column;gap:5px;
  pointer-events:none;
  opacity:0;
  transition:opacity 220ms ease;
}
#lightbox.open .lb-meta{opacity:1;pointer-events:auto}
.lb-meta-row{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;color:rgba(255,255,255,0.92);
  text-shadow:0 1px 6px rgba(0,0,0,0.9);
  white-space:nowrap;overflow:hidden;
}
.lb-meta-row a{
  color:rgba(255,255,255,0.92);
  text-decoration:underline;
  text-underline-offset:2px;
  overflow:hidden;text-overflow:ellipsis;
}

/* video: hide the action footer so native controls are fully usable */
#lightbox.has-video .lb-footer{display:none!important}
/* give video room so native controls don't hide behind meta */
#lightbox.has-video .lb-slide video{
  max-height:calc(100% - 120px);
}

.lb-footer{
  position:absolute;
  bottom:0;left:0;right:0;
  z-index:10;
  padding:18px 10px max(18px,var(--safe-bottom));
  background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,transparent 100%);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;justify-content:space-around;align-items:center;
  opacity:0;
  transition:opacity 220ms ease;
  pointer-events:none;
}
#lightbox.open .lb-footer{opacity:1;pointer-events:auto}

.lb-action{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lb-action span{font-size:11px;color:rgba(255,255,255,0.85)}

/* ── Lightbox nav arrows ── */
.lb-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:11;
  width:40px;height:40px;
  border-radius:50%;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:none;color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 220ms ease,background 150ms ease;
  -webkit-tap-highlight-color:transparent;
  pointer-events:none;
}
#lightbox.open .lb-nav{opacity:1;pointer-events:auto}
.lb-nav:hover{background:rgba(0,0,0,0.7)}
.lb-nav-prev{left:10px}
.lb-nav-next{right:10px}
.lb-nav.edge{opacity:0.18!important}

/* ── Selection bar ── */
#sel-bar{
  position:fixed;
  bottom:calc(-90px - var(--safe-bottom));
  left:0;right:0;
  max-width:600px;
  margin:0 auto;
  z-index:200;
  background:rgba(16,16,16,0.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:13px 24px max(18px,var(--safe-bottom));
  display:flex;align-items:center;justify-content:space-between;
  transition:bottom 320ms cubic-bezier(0.16,1,0.3,1);
}
#sel-bar.visible{bottom:0}
.sel-count{font-size:15px;font-weight:700;color:var(--accent)}
.sel-actions{display:flex;gap:22px}
.sel-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.sel-btn span{font-size:11px;color:rgba(255,255,255,0.8)}

/* ── State views ── */
.state-view{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60vh;gap:16px;
  color:var(--muted);font-size:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:30px;height:30px;
  border:2.5px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.75s linear infinite;
}

/* ── Desktop ── */
@media(min-width:600px){
  #app{
    border-left:1px solid rgba(255,255,255,0.06);
    border-right:1px solid rgba(255,255,255,0.06);
  }
  .media-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:900px){
  .media-grid{grid-template-columns:repeat(4,1fr)}
}
/* ── Map view ── */
#map-view{position:absolute;inset:0;background:#0b0b10}
.leaflet-container{background:#0b0b10;font-family:inherit}
#map-hud{position:absolute;top:10px;left:10px;z-index:600;background:#0009;color:#fff;
  padding:7px 11px;border-radius:10px;font-size:12px;pointer-events:none}
.bub{position:relative;width:46px;height:62px;transform:translate(-50%,-100%)}
.bub img{width:46px;height:62px;object-fit:cover;border-radius:12px;
  border:2.5px solid var(--accent,#b388ff);box-shadow:0 3px 10px rgba(0,0,0,.6);background:#222;display:block}
.bub .cnt{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;padding:0 5px;
  border-radius:10px;background:var(--accent,#b388ff);color:#1a0033;font-size:11px;font-weight:800;
  line-height:18px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.bub .pin{position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--accent,#b388ff);
  transform:translateX(-50%) rotate(45deg);border-radius:2px}
/* ── Rétro / stats dashboard ── */
#stats-view{padding:14px 16px 90px;max-width:760px;margin:0 auto}
.rt-hero{text-align:center;margin:6px 0 20px}
.rt-hero .big{font-size:40px;font-weight:800;line-height:1.05;color:var(--accent,#b388ff)}
.rt-hero .sub{color:#aaa;font-size:14px;margin-top:4px}
.rt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media(max-width:560px){.rt-tiles{grid-template-columns:repeat(2,1fr)}}
.rt-tile{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:14px 12px;text-align:center}
.rt-tile .n{font-size:24px;font-weight:800;color:#fff}
.rt-tile .l{font-size:12px;color:#9a9a9a;margin-top:3px}
.rt-sec{margin:24px 0 10px;font-size:13px;font-weight:700;color:#cfcfcf;text-transform:uppercase;letter-spacing:.04em}
.rt-bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.rt-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rt-bars .bar{width:100%;max-width:34px;background:var(--accent,#b388ff);border-radius:4px 4px 2px 2px;
  min-height:2px;transition:filter .12s}
.rt-bars .col:hover .bar{filter:brightness(1.25)}
.rt-bars .xl{font-size:10px;color:#8a8a8a}
.rt-months{display:flex;align-items:flex-end;gap:4px;height:80px}
.rt-months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.rt-months .bar{width:100%;background:#8a6fd0;border-radius:3px;min-height:2px}
.rt-months .xl{font-size:9px;color:#8a8a8a}
/* calendar heatmap */
.rt-cal-year{margin:14px 0}
.rt-cal-year .yl{font-size:12px;color:#9a9a9a;margin-bottom:5px}
.rt-cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.rt-cal .cell{width:11px;height:11px;border-radius:2px;background:#ffffff0d}
.rt-cal .cell.hit{cursor:pointer}
.rt-cal .cell.hit:hover{outline:1.5px solid #fff;outline-offset:1px}
/* brief highlight on the day you jumped to */
@keyframes dayJump{0%,60%{box-shadow:inset 0 0 0 2px #a989f5}100%{box-shadow:inset 0 0 0 2px transparent}}
.date-group.jumped .date-label{animation:dayJump 1.4s ease-out}
.rt-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11px;color:#8a8a8a;margin-top:6px}
.rt-legend .cell{width:11px;height:11px;border-radius:2px}
/* places */
.rt-place{display:flex;align-items:center;gap:10px;margin:7px 0}
.rt-place .flag{font-size:17px;width:22px;text-align:center}
.rt-place .nm{font-size:13px;color:#ddd;width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-place .track{flex:1;height:9px;background:#ffffff0d;border-radius:5px;overflow:hidden}
.rt-place .fill{height:100%;background:var(--accent,#b388ff);border-radius:5px}
.rt-place .v{font-size:12px;color:#9a9a9a;width:42px;text-align:right}
</style>
</head>
<body>
<script>window.MEMORA_DEMO=true;</script>
<div id="app">

  <!-- TABS -->
  <div class="tabs">
    <div class="tabs-row" id="tabs-row">
      <div class="tab active" data-tab="0" data-source="memories">Mes Souvenirs</div>
      <div class="tab" data-tab="1" data-source="chat">Snap Media</div>
      <div class="tab" data-tab="2" data-source="memories" data-view="map">Carte</div>
      <div class="tab" data-tab="3" data-source="memories" data-view="stats">Rétro</div>
      <button class="refresh-btn" id="add-btn" title="Ajouter un export Snapchat" aria-label="Ajouter des données" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="refresh-btn" id="random-btn" title="Souvenir aléatoire" aria-label="Aléatoire">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="3"/>
          <circle cx="8"  cy="8"  r="1.2" fill="currentColor"/>
          <circle cx="16" cy="8"  r="1.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="8"  cy="16" r="1.2" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </button>
      <button class="refresh-btn" id="refresh-btn" title="Actualiser les souvenirs" aria-label="Actualiser">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
    </div>
    <div class="tab-indicator" id="tab-indicator"></div>
  </div>

  <!-- TAB CAPTION (demo only) -->
  <div id="tab-caption"></div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-inner">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
'use strict';

// Voice-note icon (microphone) shown for audio-only media
const AUDIO_ICON_SVG = `<svg class="audio-icon" viewBox="0 0 24 24" fill="currentColor" aria-label="Audio">
  <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
  <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11z"/>
</svg>`;

// ── State ───────────────────────────────────────────────────────────────────
let allGroups   = [];
const _mediaCache = {}; // source -> groups, so re-visiting a tab is instant
let flatItems   = [];   // aligned with rendered idx values
let filtGroups  = [];
let lbIdx       = -1;
let selecting   = false;
let chosen      = new Set();
let _metaGen    = 0;
const _geoCache = {};

// ── Filters ───────────────────────────────────────────────────────────────────
let filterYear  = null;   // "YYYY" or null = all years
let filterMonth = null;   // "MM"   or null = all months
const MONTHS_FR = ['Janv','Févr','Mars','Avr','Mai','Juin',
                   'Juil','Août','Sept','Oct','Nov','Déc'];

// ── DOM ─────────────────────────────────────────────────────────────────────
const $main    = document.getElementById('main-content');
const $scroll  = document.getElementById('content');   // the one shared scroller
const _scroll  = {};                                    // remembered scrollTop per view
const $search  = document.getElementById('search-input');
const $lb      = document.getElementById('lightbox');
const $lbWrap  = document.getElementById('lb-wrap');
const $lbSlide = document.getElementById('lb-slide');
const $lbDate  = document.getElementById('lb-date');
const $lbClose = document.getElementById('lb-close');
const $lbDl    = document.getElementById('lb-dl');
const $selBar  = document.getElementById('sel-bar');
const $selCnt  = document.getElementById('sel-count');
const $selCancel = document.getElementById('sel-cancel');

// ── Active source (tab) ────────────────────────────────────────────────────
let currentSource = 'memories';
let currentView   = 'list';
let listSource    = null;   // which source is currently rendered in the list view
                            // (map/stats tabs mutate currentSource, so we can't trust it)
const sourceTitles = { memories: 'Aucun souvenir trouvé', chat: 'Aucun média trouvé' };
const sourceLoading = { memories: 'Chargement des souvenirs…', chat: 'Chargement des médias…' };
const sourceSearchPh = {
  memories: 'Rechercher dans les souvenirs…',
  chat:     'Rechercher dans les médias…',
};

// ── Demo mode ────────────────────────────────────────────────────────────────
// Served without the Python backend (e.g. the public web demo), the app reads
// precomputed JSON + static images from ./demo/ (built by build_demo.py). DEMO
// turns on automatically the first time an API call can't be reached.
let DEMO = (typeof window !== 'undefined' && window.MEMORA_DEMO === true) || /[?&]demo\b/.test(location.search);
const DEMO_BASE = 'demo';
async function getJSON(apiPath, demoName) {
  if (!DEMO) {
    try { const r = await fetch(apiPath); if (r.ok) return await r.json(); DEMO = true; }
    catch (e) { DEMO = true; }
  }
  const r = await fetch(DEMO_BASE + '/' + demoName);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}
const _enc = path => path.split('/').map(encodeURIComponent).join('/');

// ── Helpers ─────────────────────────────────────────────────────────────────
function murl(path) {
  return DEMO ? DEMO_BASE + '/img/' + currentSource + '/' + _enc(path)
              : '/media/' + currentSource + '/' + _enc(path);
}

// ── Thumbnail URL (server-generated, or static in demo) ──────────────────────
function thumbUrl(path) {
  return DEMO ? DEMO_BASE + '/thumb/' + currentSource + '/' + _enc(path) + '.jpg'
              : '/thumb/' + currentSource + '/' + _enc(path);
}

function fmtDate(d) {
  const dt   = new Date(d + 'T12:00:00');
  const now  = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const diff = Math.round((base - that) / 86400000);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return 'Hier';
  if (diff < 7)  return dt.toLocaleDateString('fr-FR', { weekday: 'long' });
  return dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Tab indicator ────────────────────────────────────────────────────────────
const TAB_CAPTIONS = {
  memories: 'Tous tes souvenirs Snapchat, triés par jour, du plus récent au plus ancien.',
  chat:     'Les photos et vidéos échangées en conversation, rassemblées au même endroit.',
  map:      'Chaque souvenir replacé sur la carte, là où tu l’as vécu.',
  stats:    'Ta vie Snapchat en chiffres : photos, vidéos, lieux et calendrier d’activité.',
};
function updateTabCaption(tab) {
  const cap = document.getElementById('tab-caption');
  if (!cap) return;
  const view = tab.dataset.view;
  const key = view === 'map' ? 'map' : view === 'stats' ? 'stats' : (tab.dataset.source || 'memories');
  cap.textContent = TAB_CAPTIONS[key] || '';
}

function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  const ind  = document.getElementById('tab-indicator');
  if (DEMO) document.getElementById('app').classList.add('demo');

  function move(tab, animate) {
    if (!animate) {
      ind.style.transition = 'none';
      requestAnimationFrame(() => { ind.style.transition = ''; });
    }
    ind.style.width     = tab.offsetWidth + 'px';
    ind.style.transform = `translateX(${tab.offsetLeft}px)`;
  }

  tabs.forEach(t => t.addEventListener('click', () => {
    const view = t.dataset.view || 'list';
    const nextSource = t.dataset.source || 'memories';
    if (t.classList.contains('active') && view === currentView && nextSource === currentSource) return;
    _scroll[currentView] = $scroll.scrollTop;   // remember where we were
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    move(t, true);
    updateTabCaption(t);
    currentView = view;
    if (view === 'map') {
      currentSource = nextSource;          // map media URLs resolve via currentSource
      showMapView();
      return;
    }
    if (view === 'stats') {
      currentSource = nextSource;
      showStatsView();
      $scroll.scrollTop = _scroll.stats || 0;   // restore (or top), not the list's stale offset
      return;
    }
    showListView();
    $scroll.scrollTop = _scroll.list || 0;
    // Reload when the list isn't already showing this source. Compare against
    // what's actually rendered (listSource), not currentSource — the map/stats
    // tabs overwrite currentSource, which used to make this guard skip wrongly
    // and leave the previous source's media on screen.
    if (listSource !== nextSource) {
      currentSource = nextSource;
      $search.value = '';
      $search.placeholder = sourceSearchPh[currentSource] || $search.placeholder;
      filterYear  = null;
      filterMonth = null;
      load();
    }
  }));

  const active = document.querySelector('.tab.active');
  if (active) { requestAnimationFrame(() => move(active, false)); updateTabCaption(active); }
}

// ── Load ─────────────────────────────────────────────────────────────────────
async function load() {
  if (_mediaCache[currentSource]) {          // instant re-visit, no refetch
    allGroups = _mediaCache[currentSource];
    buildFilterChips();
    applyFilters();
    return;
  }
  $main.innerHTML = `<div class="state-view"><div class="spinner"></div><span>${sourceLoading[currentSource] || 'Chargement…'}</span></div>`;
  try {
    allGroups = await getJSON('/api/media?source=' + encodeURIComponent(currentSource), 'media_' + currentSource + '.json');
    _mediaCache[currentSource] = allGroups;
    buildFilterChips();
    applyFilters();
  } catch (e) {
    $main.innerHTML = `<div class="state-view"><span>Erreur : ${e.message}</span></div>`;
  }
}

function buildFlat() {
  flatItems = filtGroups.flatMap(g => g.items);
}

// ── Filters (year + month chips, combined with search) ───────────────────────
function buildFilterChips() {
  const years = [...new Set(allGroups.map(g => g.date.slice(0, 4)))].sort().reverse();

  const yearRow = document.getElementById('year-row');
  yearRow.innerHTML =
    `<button class="chip" data-year="">Toutes les années</button>` +
    years.map(y => `<button class="chip" data-year="${y}">${y}</button>`).join('');

  const monthRow = document.getElementById('month-row');
  monthRow.innerHTML =
    `<button class="chip" data-month="">Tous les mois</button>` +
    MONTHS_FR.map((m, i) => {
      const mm = String(i + 1).padStart(2, '0');
      return `<button class="chip" data-month="${mm}">${m}</button>`;
    }).join('');

  yearRow.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    filterYear = c.dataset.year || null;
    syncChips();
    applyFilters();
  }));
  monthRow.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    filterMonth = c.dataset.month || null;
    syncChips();
    applyFilters();
  }));

  syncChips();
}

function syncChips() {
  document.querySelectorAll('#year-row .chip').forEach(c =>
    c.classList.toggle('active', (c.dataset.year || null) === filterYear));
  document.querySelectorAll('#month-row .chip').forEach(c =>
    c.classList.toggle('active', (c.dataset.month || null) === filterMonth));
}

function applyFilters() {
  const q = $search.value.toLowerCase().trim();
  filtGroups = allGroups.filter(g => {
    if (filterYear  && g.date.slice(0, 4) !== filterYear)  return false;
    if (filterMonth && g.date.slice(5, 7) !== filterMonth) return false;
    if (q && !g.date.includes(q)) return false;
    return true;
  });
  buildFlat();
  render();
}

// ── Search ───────────────────────────────────────────────────────────────────
$search.addEventListener('input', applyFilters);

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  listSource = currentSource;   // the source now actually painted into #main-content
  if (!filtGroups.length) {
    $main.innerHTML = `<div class="state-view"><span>${sourceTitles[currentSource] || 'Aucun élément'}</span></div>`;
    return;
  }

  // Stories — first 16 images
  const storyPairs = [];
  let si = 0;
  for (const g of filtGroups) {
    for (const item of g.items) {
      if (item.type === 'image') {
        storyPairs.push({ item, idx: si });
        if (storyPairs.length >= 16) break;
      }
      si += item.type === 'image' ? 1 : 0; // will be fixed after full scan
    }
    if (storyPairs.length >= 16) break;
  }

  // Rebuild storyPairs with correct flat indices
  const imgOnlyIdx = [];
  flatItems.forEach((item, i) => { if (item.type === 'image') imgOnlyIdx.push(i); });
  const storySlots = imgOnlyIdx.slice(0, 16);

  const storiesHTML = storySlots.length ? `
    <div class="stories-section" id="stories-row">
      ${storySlots.map(idx => {
        const item = flatItems[idx];
        const label = item.date.slice(5).replace('-', '/');
        return `
          <div class="story-item" data-idx="${idx}">
            <div class="story-ring">
              <div class="story-inner">
                <img src="${thumbUrl(item.path)}" loading="lazy" alt="">
              </div>
            </div>
            <div class="story-label">${label}</div>
          </div>`;
      }).join('')}
    </div>` : '';

  // Groups — build each day's cells HTML but keep it OUT of the DOM (in
  // _groupCells). The DOM gets empty grids with a reserved height; virtualize()
  // fills only the ones near the viewport. data-idx stays the flat index so the
  // lightbox and selection keep working whenever a cell is (re)mounted.
  let cursor = 0;
  _groupCells = [];
  const groupsHTML = filtGroups.map((g, gi) => {
    const cells = g.items.map(item => {
      const idx = cursor++;
      const vid = item.type === 'video';
      if (item.type === 'audio') {
        return `
        <div class="media-cell audio-cell" data-idx="${idx}">
          ${AUDIO_ICON_SVG}
          <div class="check-circle">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L3.8 7.5L10 1" stroke="#111" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>`;
      }
      return `
        <div class="media-cell" data-idx="${idx}">
          <img src="${thumbUrl(item.path)}" loading="lazy" decoding="async" alt="">
          ${vid ? `<div class="video-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </div>` : ''}
          <div class="check-circle">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L3.8 7.5L10 1" stroke="#111" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>`;
    }).join('');
    _groupCells.push(cells);
    return `
      <div class="date-group" data-date="${g.date}">
        <div class="date-label">${fmtDate(g.date)}</div>
        <div class="media-grid" data-gi="${gi}" data-n="${g.items.length}"></div>
      </div>`;
  }).join('');

  $main.innerHTML = storiesHTML + groupsHTML;
  virtualize();
}

// ── Virtualization (windowing by day) ────────────────────────────────────────
// Keep only grids near the viewport populated. Empty grids get a reserved
// min-height computed from column metrics so the scrollbar is correct.
let _groupCells = [];
let _vobs = null;

function _gridHeight(n, cols, cellW, gap) {
  const rows = Math.ceil(n / cols) || 1;
  return Math.round(rows * cellW + (rows + 1) * gap);  // +1 gap ≈ bottom padding
}

function _fillGrid(grid, cols, cellW, gap) {
  if (grid.dataset.filled) return;
  grid.innerHTML = _groupCells[+grid.dataset.gi] || '';
  grid.dataset.filled = '1';
  grid.style.minHeight = '';
  if (selecting && chosen.size) {                      // re-apply selection on remount
    grid.querySelectorAll('.media-cell').forEach(c => {
      if (chosen.has(+c.dataset.idx)) c.classList.add('selected');
    });
  }
}

function _emptyGrid(grid, cols, cellW, gap) {
  if (!grid.dataset.filled) return;
  grid.style.minHeight = _gridHeight(+grid.dataset.n, cols, cellW, gap) + 'px';
  grid.innerHTML = '';
  delete grid.dataset.filled;
}

function virtualize() {
  if (_vobs) { _vobs.disconnect(); _vobs = null; }
  const grids = [...$main.querySelectorAll('.media-grid[data-gi]')];
  if (!grids.length) return;

  // Measure column metrics from a live grid (handles the 2/3/4-col breakpoints
  // and the 600px cap automatically).
  const g0 = grids[0];
  const cs = getComputedStyle(g0);
  const cols = cs.gridTemplateColumns.split(' ').filter(Boolean).length || 2;
  const gap = parseFloat(cs.gap) || 2;
  const cellW = (g0.clientWidth - (cols - 1) * gap) / cols;

  // Reserve height up front so the full scroll length exists immediately
  // (filled grids already have real, content-driven height).
  for (const grid of grids)
    if (!grid.dataset.filled)
      grid.style.minHeight = _gridHeight(+grid.dataset.n, cols, cellW, gap) + 'px';

  // Fill the first few days synchronously so the first screen is never blank,
  // regardless of when the observer's first callback fires.
  for (const grid of grids.slice(0, 8)) _fillGrid(grid, cols, cellW, gap);

  _vobs = new IntersectionObserver(entries => {
    for (const e of entries) {
      const grid = e.target.querySelector('.media-grid[data-gi]');
      if (!grid) continue;
      if (e.isIntersecting) _fillGrid(grid, cols, cellW, gap);
      else _emptyGrid(grid, cols, cellW, gap);
    }
  }, { root: document.getElementById('content'), rootMargin: '1200px 0px', threshold: 0 });

  $main.querySelectorAll('.date-group').forEach(dg => _vobs.observe(dg));
}

// ── Cell interactions (event delegation — bound ONCE on $main, not per cell) ──
// Pointer events unify mouse + touch. A short press = tap (open/select); a
// 480ms hold = enter selection. Movement > 10px = scroll, not a tap.
function setupDelegation() {
  let downCell = null, downX = 0, downY = 0, lpTimer = null, lpFired = false;

  function endPress() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    if (downCell) downCell.classList.remove('tap-flash');
    downCell = null;
  }

  $main.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.media-cell');
    if (!cell) return;                       // stories/empty space: nothing to arm
    downCell = cell; downX = e.clientX; downY = e.clientY; lpFired = false;
    cell.classList.add('tap-flash');
    lpTimer = setTimeout(() => {
      lpFired = true; lpTimer = null;
      cell.classList.remove('tap-flash');
      if (!selecting) enterSelect();
      toggleSel(cell);
    }, 480);
  });

  $main.addEventListener('pointerup', e => {
    const story = e.target.closest('.story-item');
    if (story) { endPress(); openLb(+story.dataset.idx); return; }
    const cell = downCell;
    const fired = lpFired;
    endPress();
    if (cell && !fired && e.target.closest('.media-cell') === cell) tap(cell, e);
  });

  $main.addEventListener('pointermove', e => {
    if (downCell && (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10))
      endPress();                            // moved → it's a scroll, cancel
  }, { passive: true });

  ['pointercancel', 'pointerleave'].forEach(ev => $main.addEventListener(ev, endPress));
}

function tap(cell, e) {
  e.preventDefault();
  const idx = +cell.dataset.idx;
  if (selecting) toggleSel(cell);
  else openLb(idx);
}

// ── Selection ────────────────────────────────────────────────────────────────
function enterSelect() {
  selecting = true;
  $main.classList.add('selecting');

function exitSelect() {
  selecting = false;
  chosen.clear();
  $main.classList.remove('selecting');
  $selBar.classList.remove('visible');
  $main.querySelectorAll('.media-cell.selected').forEach(c => c.classList.remove('selected'));

function toggleSel(cell) {
  const idx = +cell.dataset.idx;
  if (chosen.has(idx)) { chosen.delete(idx); cell.classList.remove('selected'); }
  else                  { chosen.add(idx);    cell.classList.add('selected'); }
  updateCount();
  if (chosen.size === 0) exitSelect();
}
function updateCount() {
  const n = chosen.size;
  $selCnt.textContent = n <= 1 ? `${n} sélectionné` : `${n} sélectionnés`;
}

// ── Reverse geocoding (Nominatim, in-memory cache) ───────────────────────────
async function reverseGeocode(lat, lon) {
  const key = lat.toFixed(3) + ',' + lon.toFixed(3);
  if (_geoCache[key] !== undefined) return _geoCache[key];
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
      { headers: { 'Accept-Language': 'fr' } }
    );
    const data = await r.json();
    const a = data.address || {};
    const name = a.city || a.town || a.village || a.municipality || a.county || a.state || '';
    _geoCache[key] = name;
    return name;
  } catch {
    _geoCache[key] = '';
    return '';
  }
}

async function loadLbMeta(item) {
  const gen = ++_metaGen;
  const $time = document.getElementById('lb-time');
  const $loc  = document.getElementById('lb-loc');
  $time.style.display = 'none';
  $loc.style.display  = 'none';
  try {
    let meta;
    if (DEMO) {
      meta = { datetime: item.datetime, lat: item.lat, lon: item.lon };
    } else {
      const r = await fetch('/api/meta?source=' + encodeURIComponent(currentSource) + '&p=' + encodeURIComponent(item.path));
      if (!r.ok || gen !== _metaGen) return;
      meta = await r.json();
    }
    if (gen !== _metaGen) return;
    if (meta.datetime) {
      const dt = new Date(meta.datetime);
      document.getElementById('lb-time-text').textContent =
        dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      $time.style.display = 'inline-flex';
    }
    if (meta.lat != null && meta.lon != null) {
      const $link = document.getElementById('lb-loc-link');
      $link.href = `https://maps.apple.com/?ll=${meta.lat},${meta.lon}&z=15`;
      $link.textContent = 'Localisation…';
      $loc.style.display = 'inline-flex';
      reverseGeocode(meta.lat, meta.lon).then(name => {
        if (name && gen === _metaGen) $link.textContent = name;
      });
    }
  } catch { /* silent */ }
}

function updateNavArrows() {
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  if (prev) prev.classList.toggle('edge', lbIdx <= 0);

}

// ── Lightbox ─────────────────────────────────────────────────────────────────
function openLb(idx) {
  lbIdx = idx;
  $lb.classList.add('opening');
  requestAnimationFrame(() => {
    loadSlide(idx);
    $lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    updateNavArrows();
  });
}
function closeLb() {
  $lb.classList.remove('open');
  $lb.classList.remove('has-video');
  setTimeout(() => {
    $lb.classList.remove('opening');
    const v = $lbSlide.querySelector('video');
    if (v) { v.pause(); v.src = ''; }
    $lbSlide.innerHTML = '';
    $lbSlide.classList.remove('loaded');
    $lbSlide.style.cssText = '';
    document.body.style.overflow = '';
  }, 260);
}
function loadSlide(idx) {
  const item = flatItems[idx];
  if (!item) return;

  $lbSlide.classList.remove('loaded');
  $lbSlide.innerHTML = '';

  const dt = new Date(item.date + 'T12:00:00');
  $lbDate.textContent = dt.toLocaleDateString('fr-FR',
    { day: 'numeric', month: 'long', year: 'numeric' });

  if (item.type === 'audio') {
    $lb.classList.add('has-video');
    const wrap = document.createElement('div');
    wrap.className = 'audio-player';
    wrap.innerHTML = AUDIO_ICON_SVG;
    const a = document.createElement('audio');
    a.src = murl(item.path);
    a.controls = true;
    a.autoplay = true;
    a.addEventListener('loadedmetadata', () => $lbSlide.classList.add('loaded'));
    a.addEventListener('error', () => $lbSlide.classList.add('loaded'));
    wrap.appendChild(a);
    $lbSlide.appendChild(wrap);
  } else if (item.type === 'video') {
    $lb.classList.add('has-video');
    const v = document.createElement('video');
    v.src = murl(item.path);
    v.controls = true;
    v.autoplay = true;
    v.playsInline = true;
    v.style.cssText = 'max-width:100%;max-height:100%';
    v.addEventListener('loadedmetadata', () => $lbSlide.classList.add('loaded'));
    v.addEventListener('error', () => $lbSlide.classList.add('loaded'));
    $lbSlide.appendChild(v);
  } else {
    $lb.classList.remove('has-video');
    const img = new Image();
    img.alt = '';
    img.onload  = () => $lbSlide.classList.add('loaded');
    img.onerror = () => $lbSlide.classList.add('loaded');
    img.src = murl(item.path);
    $lbSlide.appendChild(img);
  }

  $lbDl.onclick = () => {
    const a = document.createElement('a');
    a.href = murl(item.path);
    a.download = item.path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  loadLbMeta(item);
}

function navLb(dir) {
  const next = lbIdx + dir;
  if (next < 0 || next >= flatItems.length) return;
  lbIdx = next;
  updateNavArrows();

  const outX = dir < 0 ? 60 : -60;
  $lbSlide.style.transition = 'transform 200ms ease,opacity 200ms ease';
  $lbSlide.style.transform  = `translateX(${outX}px)`;
  $lbSlide.style.opacity    = '0';

  setTimeout(() => {
    $lbSlide.style.transition = 'none';
    $lbSlide.style.transform  = `translateX(${-outX}px)`;
    $lbSlide.style.opacity    = '0';
    loadSlide(lbIdx);
    requestAnimationFrame(() => {
      $lbSlide.style.transition = 'transform 240ms ease,opacity 240ms ease';
      $lbSlide.style.transform  = 'translateX(0)';
      $lbSlide.style.opacity    = '1';
    });
  }, 200);
}

// Touch / mouse gestures on lightbox
let lbT0x = 0, lbT0y = 0, lbDrg = false;

$lbWrap.addEventListener('touchstart', e => {
  lbT0x = e.touches[0].clientX;
  lbT0y = e.touches[0].clientY;
  lbDrg = true;
}, { passive: true });

$lbWrap.addEventListener('touchmove', e => {
  if (!lbDrg) return;
  const dx = e.touches[0].clientX - lbT0x;
  const dy = e.touches[0].clientY - lbT0y;
  if (Math.abs(dx) > Math.abs(dy)) {
    e.preventDefault();
    $lbSlide.style.transition = 'none';
    $lbSlide.style.transform  = `translateX(${dx * 0.35}px)`;
  }
}, { passive: false });

$lbWrap.addEventListener('touchend', e => {
  if (!lbDrg) return;
  lbDrg = false;
  const dx = e.changedTouches[0].clientX - lbT0x;
  const dy = e.changedTouches[0].clientY - lbT0y;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
  if (Math.abs(dy) > 90 && Math.abs(dy) > Math.abs(dx)) closeLb();
  else if (Math.abs(dx) > 55) navLb(dx < 0 ? 1 : -1);
}, { passive: true });

// Desktop mouse drag
let lbM0 = 0, lbMDrg = false;
$lbWrap.addEventListener('mousedown', e => { lbM0 = e.clientX; lbMDrg = true; });
$lbWrap.addEventListener('mousemove', e => {
  if (!lbMDrg) return;
  $lbSlide.style.transition = 'none';
  $lbSlide.style.transform  = `translateX(${(e.clientX - lbM0) * 0.3}px)`;
});
$lbWrap.addEventListener('mouseup', e => {
  if (!lbMDrg) return;
  lbMDrg = false;
  const dx = e.clientX - lbM0;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
  if (Math.abs(dx) > 70) navLb(dx < 0 ? 1 : -1);
});
$lbWrap.addEventListener('mouseleave', () => {
  lbMDrg = false;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
});

$lbClose.addEventListener('click', closeLb);
document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
document.getElementById('lb-next').addEventListener('click', () => navLb(1));

document.addEventListener('keydown', e => {
  if (!$lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
  if (e.key === 'Escape')     closeLb();
});

// ── Map view (Snap-Map-style) ────────────────────────────────────────────────
const $mapView = document.getElementById('map-view');
const $statsView = document.getElementById('stats-view');
let _map = null, _cluster = null, _geoLoaded = false, _statsLoaded = false;

function showListView() {

// The full-width map overlay starts below the tab bar — and, in the demo, below
// the tab caption too (otherwise the overlay covers the Carte description).
function _mapTop() {
  const cap = document.getElementById('tab-caption');
  const anchor = (cap && getComputedStyle(cap).display !== 'none') ? cap : document.querySelector('.tabs');
  return anchor.getBoundingClientRect().bottom;
}
function showMapView() {
  document.getElementById('main-content').style.display = 'none';
  $statsView.style.display = 'none';

  document.querySelector('.filter-bar').style.display = 'none';

    `display:block;position:fixed;left:0;right:0;top:${_mapTop()}px;bottom:0;z-index:400`;
  initMap();
  if (_map) setTimeout(() => _map.invalidateSize(), 50);  // size settles after layout
  if (!_geoLoaded) { _geoLoaded = true; loadGeo(); }
}
window.addEventListener('resize', () => {
  if (currentView !== 'map') return;
  $mapView.style.top = _mapTop() + 'px';
  if (_map) _map.invalidateSize();
});

const _cnt = n => n > 999 ? '999+' : ('' + n);
function _bubbleHTML(previewPath, count) {
  return `<div class="bub"><img loading="lazy" src="${thumbUrl(previewPath)}">` +
    (count > 1 ? `<div class="cnt">${_cnt(count)}</div>` : '') + `<div class="pin"></div></div>`;
}

function initMap() {
  if (_map) return;
  _map = L.map('map-view', { worldCopyJump: true, zoomControl: true }).setView([30, 0], 2);
  const esri = (s, o) => L.tileLayer(
    `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`,
    Object.assign({ maxZoom: 18, attribution: '© Esri' }, o || {}));
  // Several basemaps the viewer can switch between (all key-free Esri services).
  const base = {
    'Sombre': L.layerGroup([esri('Canvas/World_Dark_Gray_Base'),
                            esri('Canvas/World_Dark_Gray_Reference', { opacity: .9 })]),
    'Satellite': L.layerGroup([esri('World_Imagery'),
                               esri('Reference/World_Boundaries_and_Places', { opacity: .9 })]),
    'Clair': L.layerGroup([esri('Canvas/World_Light_Gray_Base'),
                           esri('Canvas/World_Light_Gray_Reference', { opacity: .9 })]),
  };
  base['Sombre'].addTo(_map);
  L.control.layers(base, null, { position: 'topright' }).addTo(_map);
  _cluster = L.markerClusterGroup({
    maxClusterRadius: 48, showCoverageOnHover: false, spiderfyOnMaxZoom: false,
    zoomToBoundsOnClick: false,
    iconCreateFunction(c) {
      let best = null, total = 0;
      for (const m of c.getAllChildMarkers()) {
        total += m.spot.items.length;
        if (!best || m.spot.items[0].date > best.items[0].date) best = m.spot;
      }
      return L.divIcon({ html: _bubbleHTML(best.items[0].path, total), className: '', iconSize: [46, 62] });
    }
  });
  _cluster.on('clusterclick', e => {
    const items = [];
    for (const m of e.layer.getAllChildMarkers()) items.push(...m.spot.items);
    items.sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
    flatItems = items; openLb(0);
  });
  _map.addLayer(_cluster);
}

async function loadGeo() {
  const hud = document.getElementById('map-hud');
  try {
    const spots = await getJSON('/api/geo?source=memories', 'geo_memories.json');
    let total = 0;
    for (const s of spots) {
      total += s.items.length;
      const m = L.marker([s.lat, s.lon],
        { icon: L.divIcon({ html: _bubbleHTML(s.items[0].path, s.items.length), className: '', iconSize: [46, 62] }) });
      m.spot = s;
      m.on('click', () => { flatItems = s.items; openLb(0); });
      _cluster.addLayer(m);
    }
    hud.textContent = `${spots.length} lieux · ${total} souvenirs`;
  } catch (e) {
    hud.textContent = 'Erreur carte : ' + e.message;
  }
}

// ── Rétro / stats dashboard ──────────────────────────────────────────────────
function showStatsView() {
  document.getElementById('main-content').style.display = 'none';
  $mapView.style.cssText = 'display:none';
  document.querySelector('.search-wrap').style.display = 'none';
  document.querySelector('.filter-bar').style.display = 'none';

}

const flagEmoji = cc => cc && cc.length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏳️';
const MONTHS3 = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// sequential purple ramp (dark surface → brighter = more)
const CAL_STEPS = ['#ffffff0d', '#3a2a5c', '#5a3f9e', '#7c5fd0', '#a989f5', '#d4bbff'];
function calBucket(n) {
  if (!n) return 0;
  if (n <= 2) return 1; if (n <= 5) return 2; if (n <= 10) return 3; if (n <= 20) return 4; return 5;
}

async function loadStats() {
  $statsView.innerHTML = `<div class="state-view"><div class="spinner"></div><span>Calcul des statistiques… (première fois, ~1 min)</span></div>`;
  try {
    renderStats(await getJSON('/api/stats?source=memories', 'stats_memories.json'));
  } catch (e) {
    $statsView.innerHTML = `<div class="state-view"><span>Erreur : ${esc(e.message)}</span></div>`;
  }
}

function fmtFR(d) { return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }

function renderStats(s) {
  const h = Math.floor(s.videoSeconds / 3600), m = Math.round((s.videoSeconds % 3600) / 60);
  const vidTime = h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;

  // year bars
  const years = Object.keys(s.perYear);
  const ymax = Math.max(1, ...Object.values(s.perYear));
  const yearBars = years.map(y => {
    const n = s.perYear[y];
    return `<div class="col" data-year="${y}" title="${y} · ${n} souvenirs">
      <div class="bar" style="height:${Math.round(n / ymax * 110)}px"></div>
      <div class="xl">${y.slice(2)}</div></div>`;
  }).join('');

  // month bars (seasonality)
  const mmax = Math.max(1, ...s.perMonth);
  const monthBars = s.perMonth.map((n, i) =>
    `<div class="col" title="${['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][i]} · ${n}">
      <div class="bar" style="height:${Math.round(n / mmax * 64)}px"></div>
      <div class="xl">${MONTHS3[i]}</div></div>`).join('');

  // calendar heatmap, one block per year
  const cal = years.slice().reverse().map(y => {
    const start = new Date(y + '-01-01T12:00:00'), end = new Date(y + '-12-31T12:00:00');
    const pad = start.getDay();                 // leading blanks (Sun=0)
    let cells = '';
    for (let i = 0; i < pad; i++) cells += `<div class="cell" style="visibility:hidden"></div>`;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const iso = d.toISOString().slice(0, 10);
      const n = s.perDay[iso] || 0;
      const hit = n > 0 ? ` hit" data-date="${iso}` : '';
      cells += `<div class="cell${hit}" style="background:${CAL_STEPS[calBucket(n)]}" title="${fmtFR(iso)} · ${n} souvenir${n > 1 ? 's' : ''}"></div>`;
    }
    return `<div class="rt-cal-year"><div class="yl">${y}</div><div class="rt-cal">${cells}</div></div>`;
  }).join('');
  const legend = `<div class="rt-legend"><span>moins</span>${CAL_STEPS.map(c => `<span class="cell" style="background:${c}"></span>`).join('')}<span>plus</span></div>`;

  // top places
  const pmax = Math.max(1, ...s.topPlaces.map(p => p.n));
  const places = s.topPlaces.map(p =>
    `<div class="rt-place"><span class="flag">${flagEmoji(p.cc)}</span>
      <span class="nm">${esc(p.city)}</span>
      <span class="track"><span class="fill" style="width:${Math.round(p.n / pmax * 100)}%"></span></span>
      <span class="v">${p.n}</span></div>`).join('');

  $statsView.innerHTML = `
    <div class="rt-hero">
      <div class="big">${s.total.toLocaleString('fr-FR')}</div>
      <div class="sub">souvenirs · ${fmtFR(s.first)} → ${fmtFR(s.last)}</div>
      <div class="sub">${s.countries} pays · ${s.cities} villes</div>
    </div>
    <div class="rt-tiles">
      <div class="rt-tile"><div class="n">${s.photos.toLocaleString('fr-FR')}</div><div class="l">Photos</div></div>
      <div class="rt-tile"><div class="n">${s.videos.toLocaleString('fr-FR')}</div><div class="l">Vidéos</div></div>
      <div class="rt-tile"><div class="n">${vidTime}</div><div class="l">Temps vidéo</div></div>
      <div class="rt-tile"><div class="n">${s.countries}</div><div class="l">Pays</div></div>
    </div>
    <div class="rt-sec">Par année</div>
    <div class="rt-bars" id="rt-years">${yearBars}</div>
    <div class="rt-sec">Saisonnalité (par mois, toutes années)</div>
    <div class="rt-months">${monthBars}</div>
    <div class="rt-sec">Calendrier d'activité</div>
    ${legend}${cal}
    <div class="rt-sec">Top lieux</div>
    ${places}
    <div class="rt-sec">Records</div>
    <div class="sub" style="color:#bbb;font-size:13px;line-height:1.7">
      Jour le plus actif : <b>${fmtFR(s.busiestDay.date)}</b> (${s.busiestDay.n} souvenirs)<br>
      Année record : <b>${s.busiestYear.year}</b> (${s.busiestYear.n} souvenirs)
    </div>`;

  // click a year bar → open that year in the gallery
  $statsView.querySelectorAll('#rt-years .col').forEach(col => col.addEventListener('click', () => {
    const y = col.dataset.year;
    document.querySelector('.tab[data-tab="0"]').click();   // back to Souvenirs
    filterYear = y; filterMonth = null; syncChips(); applyFilters();
  }));

  // click a calendar day (with memories) → jump to that exact day in the gallery
  $statsView.querySelectorAll('.rt-cal .cell.hit').forEach(cell =>
    cell.addEventListener('click', () => goToDay(cell.dataset.date)));
}

// Open the Souvenirs list on the month of `iso` and scroll to that exact day.
// Filtering to the month keeps the virtualized scroll offsets small, so the
// jump lands accurately; then the day's group flashes briefly.
function goToDay(iso) {
  document.querySelector('.tab[data-tab="0"]').click();   // switch to Souvenirs (loads memories if needed)
  filterYear = iso.slice(0, 4); filterMonth = iso.slice(5, 7);
  syncChips(); applyFilters();
  const scroll = () => {
    const el = $main.querySelector(`.date-group[data-date="${iso}"]`);
    if (!el) return false;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('jumped');
    setTimeout(() => el.classList.remove('jumped'), 1500);
    return true;
  };
  requestAnimationFrame(() => { if (!scroll()) setTimeout(scroll, 250); });  // retry once if list still loading
}

// Column count/width change on resize → recompute reserved heights.
let _rzT = null;
window.addEventListener('resize', () => {
  clearTimeout(_rzT);
  _rzT = setTimeout(() => { if ($main.querySelector('.media-grid[data-gi]')) virtualize(); }, 200);
});

    <div id="lic-err"></div>
  </div>`;

  async function refresh(){
    try {
      const d = await (await fetch('/api/license')).json();
      document.getElementById('lic-free').textContent = d.freeLimit;
      if (d.pro) { bar.classList.remove('on'); return; }

// ── Add data (desktop app only): pick export zip(s) → import → refresh ────────
(function importUI(){
  const addBtn = document.getElementById('add-btn');
  if (!addBtn) return;
  // pywebview injects its API asynchronously; reveal the button once it's there.
  function hasApi(){ return !!(window.pywebview && window.pywebview.api && window.pywebview.api.run_import); }
  function reveal(){ if (hasApi()) addBtn.style.display = ''; }
  window.addEventListener('pywebviewready', reveal);
  let tries = 0; const t = setInterval(() => { reveal(); if (hasApi() || ++tries > 40) clearInterval(t); }, 150);

  const st = document.createElement('style');
  st.textContent = `
    #imp-modal{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82)}
    #imp-modal.on{display:flex}
    #imp-modal .box{background:#17171f;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;max-width:520px;width:100%;color:#fff}
    #imp-modal h3{margin:0 0 10px;font-size:17px}
    #imp-log{background:#000;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;
      font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe;max-height:300px;overflow:auto;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
    #imp-modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
    #imp-modal button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 15px;cursor:pointer;background:#ffffff18;color:#fff}
    #imp-modal button.primary{background:#FFFC00;color:#1a1a00}
    #imp-modal button:disabled{opacity:.5;cursor:default}`;
  document.head.appendChild(st);
  const modal = document.createElement('div');
  modal.id = 'imp-modal';
  modal.innerHTML = `<div class="box">
    <h3>Ajouter un export Snapchat</h3>
    <div id="imp-log">Sélectionne un ou plusieurs fichiers .zip…</div>
    <div class="row">
      <button id="imp-copy">Copier</button>
      <button id="imp-close">Fermer</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  const log = modal.querySelector('#imp-log');
  const closeBtn = modal.querySelector('#imp-close');
  let busy = false;

  window.onImportLog = function(msg){
    if (msg === '__DONE__' || msg === '__FAIL__'){
      busy = false; closeBtn.disabled = false;
      if (msg === '__FAIL__') {
        log.textContent += '\n⚠️ Import interrompu — voir le message ci-dessus.';
      } else {
        log.textContent += '\n✅ Import terminé.';
        for (const k in _mediaCache) delete _mediaCache[k];
        _geoLoaded = false; _statsLoaded = false;
        if (currentView === 'list') load();
      }
      log.scrollTop = log.scrollHeight;
    } else {
      log.textContent += (log.textContent ? '\n' : '') + msg;
      log.scrollTop = log.scrollHeight;
    }
  };

  addBtn.addEventListener('click', async () => {
    if (busy) { modal.classList.add('on'); return; }
    const api = window.pywebview.api;
    const zips = await api.pick_exports();
    if (!zips || !zips.length) return;
    log.textContent = '▶ Import de ' + zips.length + ' fichier(s)…';
    modal.classList.add('on'); busy = true; closeBtn.disabled = true;
    api.run_import(zips);
  });
  closeBtn.addEventListener('click', () => { if (!busy) modal.classList.remove('on'); });
  modal.querySelector('#imp-copy').addEventListener('click', () => {
    try { navigator.clipboard.writeText(log.textContent || ''); } catch(e){}
  });
})();
</script>
