<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Souvenirs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0d0d;
  --bg2:#1c1c1c;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.5);
  --accent:#FFFC00;
  --gap:2px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,'SF Pro Text','Inter','Helvetica Neue',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── App shell ── */
#app{
  height:100vh;
  max-width:600px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* ── Tabs ── */
.tabs{
  position:relative;
  background:rgba(13,13,13,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding-top:max(14px,var(--safe-top));
  flex-shrink:0;
  z-index:50;
}
.tabs-row{
  display:flex;
  position:relative;
  align-items:center;
}
.refresh-btn{
  flex-shrink:0;
  width:34px;height:34px;
  margin-right:6px;margin-bottom:10px;
  border:none;background:none;
  color:rgba(255,255,255,0.45);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  transition:color 200ms,background 200ms;
  -webkit-tap-highlight-color:transparent;
}
.refresh-btn:hover{color:#fff;background:rgba(255,255,255,0.1)}
.refresh-btn.spinning svg{animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab{
  flex:1;
  text-align:center;
  padding:0 4px 12px;
  font-size:14px;
  font-weight:500;
  color:rgba(255,255,255,0.42);
  cursor:pointer;
  transition:color 250ms ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  letter-spacing:-0.01em;
}
.tab.active{color:#fff}
.tab-indicator{
  position:absolute;
  bottom:0;
  height:2px;
  background:#fff;
  border-radius:1px 1px 0 0;
  transition:transform 300ms cubic-bezier(0.4,0,0.2,1),
             width 300ms cubic-bezier(0.4,0,0.2,1);
  transform-origin:left center;
  pointer-events:none;
}
/* one-line description of the active tab — shown only in the web demo */
#tab-caption{display:none}
#app.demo #tab-caption{display:block;padding:9px 16px 3px;font-size:12.5px;
  color:rgba(255,255,255,0.55);text-align:center;line-height:1.45;background:var(--bg)}

/* ── Search ── */
.search-wrap{
  padding:8px 14px 10px;
  background:var(--bg);
  flex-shrink:0;
}
.search-inner{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.11);
  border-radius:999px;
  height:38px;
  padding:0 14px;
  transition:background 180ms ease;
}
.search-inner:focus-within{background:rgba(255,255,255,0.18)}
.search-icon{color:rgba(255,255,255,0.55);flex-shrink:0}
.search-inner input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:#fff;
  font-size:14px;
  font-family:inherit;
}
.search-inner input::placeholder{color:rgba(255,255,255,0.42)}

/* ── Souvenirs carousel (flashbacks / voyages / au hasard / rétro) ── */
.souvenirs{
  display:flex;
  gap:11px;
  padding:4px 14px 14px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}
.souvenirs[hidden]{display:none}
.souvenirs::-webkit-scrollbar{display:none}
.souv-card{
  position:relative;
  flex-shrink:0;
  width:150px;
  height:196px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  scroll-snap-align:start;
  background:rgba(255,255,255,0.06);
  -webkit-tap-highlight-color:transparent;
  transition:transform 140ms ease;
  box-shadow:0 6px 18px rgba(0,0,0,0.35);
}
.souv-card:active{transform:scale(0.96)}
.souv-card img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.souv-card .souv-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.82) 0%,rgba(0,0,0,0.25) 45%,rgba(0,0,0,0.05) 100%);
}
.souv-kind{
  position:absolute;top:9px;left:9px;
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(0,0,0,0.42);
  backdrop-filter:blur(6px);
  color:#fff;
  font-size:10.5px;font-weight:700;letter-spacing:0.01em;
  text-transform:uppercase;
}
.souv-txt{
  position:absolute;left:11px;right:11px;bottom:11px;
  color:#fff;
}
.souv-title{font-size:15px;font-weight:700;line-height:1.15;letter-spacing:-0.01em}
.souv-sub{margin-top:3px;font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.82)}
.souv-reroll{
  position:absolute;top:7px;right:7px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:999px;
  background:rgba(0,0,0,0.42);backdrop-filter:blur(6px);
  color:#fff;font-size:15px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.souv-reroll:active{transform:rotate(-40deg)}

/* ── Timeline scrubber (replaces the year/month chips) ── */
.scrubber{
  position:fixed;
  right:2px;
  width:30px;
  z-index:350;
  display:flex;flex-direction:column;align-items:stretch;
  justify-content:space-between;
  padding:4px 0;
  touch-action:none;
  opacity:0;
  transition:opacity 180ms ease;
}
.scrubber[hidden]{display:none}
.scrubber.ready{opacity:0.55}
.scrubber:hover,.scrubber.dragging{opacity:1}
.scrubber .sc-tick{
  flex:1;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px;
  color:rgba(255,255,255,0.65);
  font-size:10px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.scrubber .sc-tick.active{color:var(--accent)}
.sc-bubble{
  position:fixed;
  right:40px;
  padding:7px 13px;
  border-radius:12px;
  background:var(--accent);
  color:#111;
  font-size:13px;font-weight:700;
  white-space:nowrap;
  transform:translateY(-50%);
  pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
  opacity:0;transition:opacity 120ms ease;
  z-index:360;
}
.sc-bubble.show{opacity:1}

/* ── Scrollable content ── */
.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.content::-webkit-scrollbar{width:0}

/* ── Date groups ── */
.date-label{
  padding:7px 12px 4px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.065em;
  color:rgba(255,255,255,0.65);
  text-transform:uppercase;
  position:sticky;
  top:0;
  background:rgba(13,13,13,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:5;
}

/* ── Media grid ── */
.media-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  padding:0 var(--gap) var(--gap);
}

/* Day-groups are virtualized in JS (see virtualize()): only grids near the
   viewport hold their cells; the rest are empty with a reserved min-height, so
   the DOM stays small (hundreds of nodes, not 20k+) and scrolling is native. */

.media-cell{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:var(--bg2);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform 120ms ease,outline 100ms ease;
  outline:2.5px solid transparent;
  outline-offset:-2.5px;
}
.media-cell.selected{outline-color:#fff}
.media-cell.tap-flash{transform:scale(0.96) translateY(0)!important}

.media-cell img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.video-badge{
  position:absolute;
  bottom:6px;right:7px;
  pointer-events:none;
}
.audio-cell{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5b57d6,#8a56d6);
}
.audio-cell .audio-icon{
  width:42%;height:42%;color:rgba(255,255,255,0.92);
}
.audio-player{
  display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:26px;
}
.audio-player .audio-icon{
  width:84px;height:84px;color:#fff;opacity:0.92;
}
.check-circle{
  position:absolute;
  top:7px;right:7px;
  width:22px;height:22px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.75);
  background:rgba(0,0,0,0.25);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 150ms,background 150ms,border-color 150ms;
  pointer-events:none;
}
.selecting .check-circle{opacity:1}
.media-cell.selected .check-circle{background:#fff;border-color:#fff}

/* ── Lightbox ── */
#lightbox{
  position:fixed;inset:0;
  z-index:999;
  background:#000;
  display:none;
  flex-direction:column;
  user-select:none;
}
#lightbox.opening,#lightbox.open{display:flex}

.lb-bg{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  transition:opacity 250ms ease;
}
#lightbox.open .lb-bg{opacity:1}

.lb-header{
  position:absolute;
  top:0;left:0;right:0;
  z-index:10;
  padding:max(18px,var(--safe-top)) 16px 24px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);
  display:flex;align-items:center;justify-content:space-between;
  opacity:0;
  transition:opacity 220ms ease;
  pointer-events:none;
}
#lightbox.open .lb-header{opacity:1;pointer-events:auto}

.lb-close{
  width:38px;height:38px;
  border-radius:50%;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  border:none;color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
/* "Défilement auto": iOS-style switch (a native checkbox) */
.lb-auto{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,0.85);-webkit-tap-highlight-color:transparent}
.lb-auto input{appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer;position:relative;
  width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,0.22);transition:background 200ms ease}
.lb-auto input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform 220ms cubic-bezier(.3,1.3,.5,1)}
.lb-auto input:checked{background:#34c759}
.lb-auto input:checked::after{transform:translateX(18px)}
.lb-auto input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lb-date{
  font-size:13px;
  color:rgba(255,255,255,0.78);
  font-weight:500;
}

.lb-media-wrap{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
  touch-action:none;
}
.lb-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  will-change:transform;
}
.lb-slide img,.lb-slide video{
  max-width:100%;max-height:100%;
  object-fit:contain;
  transform:scale(0.88);
  opacity:0;
  transition:transform 260ms cubic-bezier(0.16,1,0.3,1),opacity 220ms ease;
  display:block;
}
.lb-slide.loaded img,.lb-slide.loaded video{transform:scale(1);opacity:1}

/* meta panel: time + location, above footer */
.lb-meta{
  position:absolute;
  bottom:80px;left:0;right:0;
  z-index:10;
  padding:0 18px 6px;
  display:flex;flex-direction:column;gap:5px;
  pointer-events:none;
  opacity:0;
  transition:opacity 220ms ease;
}
#lightbox.open .lb-meta{opacity:1;pointer-events:auto}
.lb-meta-row{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;color:rgba(255,255,255,0.92);
  text-shadow:0 1px 6px rgba(0,0,0,0.9);
  white-space:nowrap;overflow:hidden;
}
.lb-meta-row a{
  color:rgba(255,255,255,0.92);
  text-decoration:underline;
  text-underline-offset:2px;
  overflow:hidden;text-overflow:ellipsis;
}

/* video: hide the action footer so native controls are fully usable */
#lightbox.has-video .lb-footer{display:none!important}
/* give video room so native controls don't hide behind meta */
#lightbox.has-video .lb-slide video{
  max-height:calc(100% - 120px);
}

.lb-footer{
  position:absolute;
  bottom:0;left:0;right:0;
  z-index:10;
  padding:18px 10px max(18px,var(--safe-bottom));
  background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,transparent 100%);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;justify-content:space-around;align-items:center;
  opacity:0;
  transition:opacity 220ms ease;
  pointer-events:none;
}
#lightbox.open .lb-footer{opacity:1;pointer-events:auto}

.lb-action{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lb-action span{font-size:11px;color:rgba(255,255,255,0.85)}

/* ── Lightbox nav arrows ── */
.lb-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:11;
  width:40px;height:40px;
  border-radius:50%;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:none;color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity 220ms ease,background 150ms ease;
  -webkit-tap-highlight-color:transparent;
  pointer-events:none;
}
#lightbox.open .lb-nav{opacity:1;pointer-events:auto}
.lb-nav:hover{background:rgba(0,0,0,0.7)}
.lb-nav-prev{left:10px}
.lb-nav-next{right:10px}
.lb-nav.edge{opacity:0.18!important}

/* ── Selection bar ── */
#sel-bar{
  position:fixed;
  bottom:calc(-90px - var(--safe-bottom));
  left:0;right:0;
  max-width:600px;
  margin:0 auto;
  z-index:200;
  background:rgba(16,16,16,0.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:13px 24px max(18px,var(--safe-bottom));
  display:flex;align-items:center;justify-content:space-between;
  transition:bottom 320ms cubic-bezier(0.16,1,0.3,1);
}
#sel-bar.visible{bottom:0}
.sel-count{font-size:15px;font-weight:700;color:var(--accent)}
.sel-actions{display:flex;gap:22px}
.sel-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.sel-btn span{font-size:11px;color:rgba(255,255,255,0.8)}

/* ── State views ── */
.state-view{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60vh;gap:16px;
  color:var(--muted);font-size:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:30px;height:30px;
  border:2.5px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.75s linear infinite;
}

/* ── Desktop ── */
@media(min-width:600px){
  #app{
    border-left:1px solid rgba(255,255,255,0.06);
    border-right:1px solid rgba(255,255,255,0.06);
  }
  .media-grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:900px){
  .media-grid{grid-template-columns:repeat(4,1fr)}
}
/* ── Map view ── */
#map-view{position:absolute;inset:0;background:#0b0b10}
.leaflet-container{background:#0b0b10;font-family:inherit}
#map-hud{position:absolute;top:10px;left:56px;z-index:600;background:#0009;color:#fff;
  padding:7px 11px;border-radius:10px;font-size:12px;pointer-events:none;max-width:calc(100% - 80px)}
#map-hud small{display:block;margin-top:3px;color:rgba(255,255,255,.6);font-size:11px}
#map-note{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:650;width:min(520px,calc(100% - 32px));
  background:rgba(23,23,31,.96);border:1px solid #ffb34766;border-radius:14px;padding:14px 38px 14px 16px;
  color:rgba(255,255,255,.82);font-size:13.5px;line-height:1.5;box-shadow:0 10px 30px #0008}
#map-note b:first-of-type{display:block;color:#ffcf7a;font-size:14.5px;margin-bottom:4px}
#map-note code{font:12.5px ui-monospace,Menlo,monospace;color:#fff}
#map-note .x{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.bub{position:relative;width:46px;height:62px;transform:translate(-50%,-100%)}
.bub img{width:46px;height:62px;object-fit:cover;border-radius:12px;
  border:2.5px solid var(--accent,#b388ff);box-shadow:0 3px 10px rgba(0,0,0,.6);background:#222;display:block}
.bub .cnt{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;padding:0 5px;
  border-radius:10px;background:var(--accent,#b388ff);color:#1a0033;font-size:11px;font-weight:800;
  line-height:18px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.bub .pin{position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--accent,#b388ff);
  transform:translateX(-50%) rotate(45deg);border-radius:2px}
/* ── Rétro / stats dashboard ── */
#stats-view{padding:14px 16px 90px;max-width:760px;margin:0 auto}
.rt-hero{text-align:center;margin:6px 0 20px}
.rt-hero .big{font-size:40px;font-weight:800;line-height:1.05;color:var(--accent,#b388ff)}
.rt-hero .sub{color:#aaa;font-size:14px;margin-top:4px}
.rt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media(max-width:560px){.rt-tiles{grid-template-columns:repeat(2,1fr)}}
.rt-tile{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:14px 12px;text-align:center}
.rt-tile .n{font-size:24px;font-weight:800;color:#fff}
.rt-tile .l{font-size:12px;color:#9a9a9a;margin-top:3px}
.rt-sec{margin:24px 0 10px;font-size:13px;font-weight:700;color:#cfcfcf;text-transform:uppercase;letter-spacing:.04em}
.rt-bars{display:flex;align-items:flex-end;gap:6px;height:130px}
.rt-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rt-bars .bar{width:100%;max-width:34px;background:var(--accent,#b388ff);border-radius:4px 4px 2px 2px;
  min-height:2px;transition:filter .12s}
.rt-bars .col:hover .bar{filter:brightness(1.25)}
.rt-bars .xl{font-size:10px;color:#8a8a8a}
.rt-months{display:flex;align-items:flex-end;gap:4px;height:80px}
.rt-months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.rt-months .bar{width:100%;background:#8a6fd0;border-radius:3px;min-height:2px}
.rt-months .xl{font-size:9px;color:#8a8a8a}
/* calendar heatmap */
.rt-cal-year{margin:14px 0}
.rt-cal-year .yl{font-size:12px;color:#9a9a9a;margin-bottom:5px}
.rt-cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.rt-cal .cell{width:11px;height:11px;border-radius:2px;background:#ffffff0d}
.rt-cal .cell.hit{cursor:pointer}
.rt-cal .cell.hit:hover{outline:1.5px solid #fff;outline-offset:1px}
/* brief highlight on the day you jumped to */
@keyframes dayJump{0%,60%{box-shadow:inset 0 0 0 2px #a989f5}100%{box-shadow:inset 0 0 0 2px transparent}}
.date-group.jumped .date-label{animation:dayJump 1.4s ease-out}

// ── Helpers ─────────────────────────────────────────────────────────────────
function murl(path) {
  return DEMO ? DEMO_BASE + '/img/' + currentSource + '/' + _enc(path)
              : '/media/' + currentSource + '/' + _enc(path);
}

// ── Thumbnail URL (server-generated, or static in demo) ──────────────────────
function thumbUrl(path) {
  return DEMO ? DEMO_BASE + '/thumb/' + currentSource + '/' + _enc(path) + '.jpg'
              : '/thumb/' + currentSource + '/' + _enc(path);
}

function fmtDate(d) {
  const dt   = new Date(d + 'T12:00:00');
  const now  = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const diff = Math.round((base - that) / 86400000);
  if (diff === 0) return t("Aujourd'hui");
  if (diff === 1) return t('Hier');
  if (diff < 7)  return dt.toLocaleDateString(LOCALE, { weekday: 'long' });
  return dt.toLocaleDateString(LOCALE, { day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Tab indicator ────────────────────────────────────────────────────────────
const TAB_CAPTIONS = {
  memories: 'Tous tes souvenirs Snapchat, triés par jour, du plus récent au plus ancien.',
  chat:     'Les photos et vidéos échangées en conversation, rassemblées au même endroit.',
  map:      'Chaque souvenir replacé sur la carte, là où tu l’as vécu.',
  stats:    'Ta vie Snapchat en chiffres : photos, vidéos, lieux et calendrier d’activité.',
};
function updateTabCaption(tab) {
  const cap = document.getElementById('tab-caption');
  if (!cap) return;
  const view = tab.dataset.view;
  const key = view === 'map' ? 'map' : view === 'stats' ? 'stats' : (tab.dataset.source || 'memories');
  cap.textContent = t(TAB_CAPTIONS[key] || '');
}

function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  const ind  = document.getElementById('tab-indicator');
  if (DEMO) document.getElementById('app').classList.add('demo');

  function move(tab, animate) {
    if (!animate) {
      ind.style.transition = 'none';
      requestAnimationFrame(() => { ind.style.transition = ''; });
    }
    ind.style.width     = tab.offsetWidth + 'px';
    ind.style.transform = `translateX(${tab.offsetLeft}px)`;
  }

  tabs.forEach(t => t.addEventListener('click', () => {
    const view = t.dataset.view || 'list';
    const nextSource = t.dataset.source || 'memories';
    if (t.classList.contains('active') && view === currentView && nextSource === currentSource) return;
    _scroll[currentView] = $scroll.scrollTop;   // remember where we were
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    move(t, true);
    updateTabCaption(t);
    currentView = view;
    if (view === 'map') {
      currentSource = nextSource;          // map media URLs resolve via currentSource
      showMapView();
      return;
    }
    if (view === 'stats') {
      currentSource = nextSource;
      showStatsView();
      $scroll.scrollTop = _scroll.stats || 0;   // restore (or top), not the list's stale offset
      return;
    }
    showListView();
    $scroll.scrollTop = _scroll.list || 0;
    // Reload when the list isn't already showing this source. Compare against
    // what's actually rendered (listSource), not currentSource — the map/stats
    // tabs overwrite currentSource, which used to make this guard skip wrongly
    // and leave the previous source's media on screen.
    if (listSource !== nextSource) {
      currentSource = nextSource;
      $search.value = '';
      $search.placeholder = sourceSearchPh[currentSource] || $search.placeholder;
      load();
    }
  }));

  const active = document.querySelector('.tab.active');
  if (active) { requestAnimationFrame(() => move(active, false)); updateTabCaption(active); }
}

// ── Load ─────────────────────────────────────────────────────────────────────
async function load() {
  if (_mediaCache[currentSource]) {          // instant re-visit, no refetch
    allGroups = _mediaCache[currentSource];
    applyFilters();
    buildScrubber();
    buildSouvenirs();
    return;
  }
  $main.innerHTML = `<div class="state-view"><div class="spinner"></div><span>${sourceLoading[currentSource] || 'Chargement…'}</span></div>`;
  try {
    allGroups = await getJSON('/api/media?source=' + encodeURIComponent(currentSource), 'media_' + currentSource + '.json');
    _mediaCache[currentSource] = allGroups;
    applyFilters();
    buildScrubber();
    buildSouvenirs();
  } catch (e) {
    $main.innerHTML = `<div class="state-view"><span>Erreur : ${e.message}</span></div>`;
  }
}

function buildFlat() {
  flatItems = filtGroups.flatMap(g => g.items);
}

// ── Search (the only grid filter now; year/month moved to the scrubber) ──────
function applyFilters() {
  const q = $search.value.toLowerCase().trim();
  filtGroups = q ? allGroups.filter(g => g.date.includes(q)) : allGroups;
  buildFlat();
  render();
}

// ── Souvenirs carousel ───────────────────────────────────────────────────────
// Cards built from the already-loaded day-groups (flashbacks / random / season)
// plus the /api/trips endpoint (voyages). Tapping a card opens its snaps in the
// existing lightbox — same pattern the map uses (flatItems = …; openLb(0)).
const $souv = document.getElementById('souvenirs');
let _souvCards = [];                 // [{items}] parallel to the rendered cards
let _tripsData = null;               // cached /api/trips result for the current source
const SEASONS = [['hiver',[12,1,2]], ['printemps',[3,4,5]], ['été',[6,7,8]], ['automne',[9,10,11]]];

async function buildSouvenirs() {
  // Souvenirs are a memories concept (chat has no trips/places).
  if (currentSource !== 'memories' || !allGroups.length) { $souv.hidden = true; return; }
  if (_tripsData === null) {
    try { _tripsData = await getJSON('/api/trips?source=memories', 'trips_memories.json'); }
    catch (e) { _tripsData = []; }
  }
  renderSouvenirs();
}

function _souvThisDay() {
  // Snaps from the same calendar day in past years (±3 days if the exact day is empty).
  const now = new Date();
  const curY = now.getFullYear();
  const ord = d => { const x = new Date(now.getFullYear(), d.getMonth(), d.getDate()); return Math.round((x - new Date(now.getFullYear(), 0, 0)) / 864e5); };
  const today = ord(now);
  const best = {};   // year -> {dist, group}
  for (const g of allGroups) {
    const y = +g.date.slice(0, 4);
    if (y >= curY) continue;
    const gd = new Date(g.date + 'T12:00:00');
    let dist = Math.abs(ord(gd) - today);
    dist = Math.min(dist, 365 - dist);           // wrap around the year
    if (dist > 3) continue;
    if (!best[y] || dist < best[y].dist) best[y] = { dist, group: g };
  }
  return Object.keys(best).sort().reverse().map(y => {
    const g = best[y].group, n = curY - (+y);
    return { kind: t('Ce jour-là'), title: n === 1 ? t('Il y a 1 an') : tf('Il y a {n} ans', { n }),
             sub: fmtFR(g.date), cover: g.items[0].path, items: g.items };
  });
}

function _souvSeasons() {
  // Busiest (year, season) buckets → "Ton été 2023".
  const buckets = {};   // "year|season" -> {items, label, year}
  for (const g of allGroups) {
    const y = g.date.slice(0, 4), mo = +g.date.slice(5, 7);
    const s = SEASONS.find(([, ms]) => ms.includes(mo));
    if (!s) continue;
    const k = y + '|' + s[0];
    (buckets[k] || (buckets[k] = { items: [], label: s[0], year: y })).items.push(...g.items);
  }
  return Object.values(buckets)
    .filter(b => b.items.length >= 8)
    .sort((a, b) => b.items.length - a.items.length)
    .slice(0, 3)
    .map(b => ({ kind: 'Rétro', title: tf('Ton {s} {y}', { s: t(b.label), y: b.year }),
                 sub: tf('{n} souvenirs', { n: b.items.length }), cover: b.items[0].path, items: b.items }));
}

function _souvRandom() {
  const g = allGroups[Math.floor(Math.random() * allGroups.length)];
  if (!g) return null;
  const it = g.items[Math.floor(Math.random() * g.items.length)];
  return { kind: t('Au hasard'), title: t('Souvenir surprise'), sub: fmtFR(g.date),
           cover: it.path, items: g.items, reroll: true };
}

function renderSouvenirs() {
  const trips = (_tripsData || []).slice(0, 6).map(trip => ({
    kind: t('Voyage'), title: tf('Voyage à {c}', { c: trip.city }),
    sub: `${new Date(trip.end + 'T12:00:00').toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' })} · ${trip.count} snaps`,
    cover: trip.cover, items: trip.items,
  }));
  const rnd = _souvRandom();
  let cards = [..._souvThisDay(), ...trips, ..._souvSeasons()];
  cards = cards.slice(0, 9);
  if (rnd) cards.push(rnd);              // always end on a surprise

  _souvCards = cards;
  if (!cards.length) { $souv.hidden = true; return; }
  $souv.hidden = false;
  $souv.innerHTML = cards.map((c, i) => `
    <div class="souv-card" data-i="${i}">
      <img src="${thumbUrl(c.cover)}" loading="lazy" decoding="async" alt="">
      <div class="souv-grad"></div>
      <div class="souv-kind">${esc(c.kind)}</div>
      ${c.reroll ? '<button class="souv-reroll" data-reroll aria-label="Un autre">↻</button>' : ''}
      <div class="souv-txt">
        <div class="souv-title">${esc(c.title)}</div>
        <div class="souv-sub">${esc(c.sub)}</div>
      </div>
    </div>`).join('');
}

$souv.addEventListener('click', e => {
  if (e.target.closest('[data-reroll]')) { renderSouvenirs(); return; }
  const card = e.target.closest('.souv-card');
  if (!card) return;
  const c = _souvCards[+card.dataset.i];
  if (c && c.items.length) { flatItems = c.items; openLb(0); }
});

// ── Timeline scrubber (year/month navigation) ────────────────────────────────
const $scrub = document.getElementById('scrubber');
const $scrubBubble = document.getElementById('sc-bubble');
let _scrubYears = [];

function buildScrubber() {
  _scrubYears = [...new Set(allGroups.map(g => g.date.slice(0, 4)))].sort().reverse();
  if (allGroups.length < 2) { $scrub.hidden = true; return; }
  $scrub.innerHTML = _scrubYears.map(y => `<div class="sc-tick" data-year="${y}">${y.slice(2)}</div>`).join('');
  $scrub.hidden = (currentView !== 'list');
  positionScrubber();
  requestAnimationFrame(() => $scrub.classList.add('ready'));
}

function positionScrubber() {
  const r = $scroll.getBoundingClientRect();
  $scrub.style.top = r.top + 'px';
  $scrub.style.height = r.height + 'px';
}

// Map a Y position on the track to a day-group, show the month/year bubble.
function _scrubTarget(clientY) {
  const r = $scrub.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
  const idx = Math.min(allGroups.length - 1, Math.round(frac * (allGroups.length - 1)));
  return allGroups[idx];
}

function _scrubShow(clientY) {
  const g = _scrubTarget(clientY);
  if (!g) return;
  $scrubBubble.textContent = `${MONTHS_FR[+g.date.slice(5, 7) - 1]} ${g.date.slice(0, 4)}`;
  $scrubBubble.style.top = clientY + 'px';
  $scrubBubble.classList.add('show');
  $scrub.querySelectorAll('.sc-tick').forEach(t =>
    t.classList.toggle('active', t.dataset.year === g.date.slice(0, 4)));
  return g;
}

let _scrubbing = false;
$scrub.addEventListener('pointerdown', e => {
  _scrubbing = true; $scrub.classList.add('dragging');
  $scrub.setPointerCapture(e.pointerId);
  _scrubShow(e.clientY);
});
$scrub.addEventListener('pointermove', e => { if (_scrubbing) _scrubShow(e.clientY); });
function _scrubEnd(e) {
  if (!_scrubbing) return;
  _scrubbing = false; $scrub.classList.remove('dragging');
  $scrubBubble.classList.remove('show');
  const g = _scrubTarget(e.clientY);
  if (g) scrollToDay(g.date);
}
$scrub.addEventListener('pointerup', _scrubEnd);
$scrub.addEventListener('pointercancel', _scrubEnd);

// A tap on a year tick jumps to the newest day of that year.
$scrub.addEventListener('click', e => {
  const t = e.target.closest('.sc-tick');
  if (t && !_scrubbing) goToYear(t.dataset.year);
});

// Passive: while the grid scrolls, keep the current year's tick highlighted.
let _scrubRaf = 0;
$scroll.addEventListener('scroll', () => {
  if (_scrubRaf || $scrub.hidden) return;
  _scrubRaf = requestAnimationFrame(() => {
    _scrubRaf = 0;
    const top = $scroll.getBoundingClientRect().top + 4;
    for (const dg of $main.querySelectorAll('.date-group')) {
      if (dg.getBoundingClientRect().bottom > top) {
        const y = dg.dataset.date.slice(0, 4);
        $scrub.querySelectorAll('.sc-tick').forEach(t => t.classList.toggle('active', t.dataset.year === y));
        break;
      }
    }
  });
}, { passive: true });

// ── Search ───────────────────────────────────────────────────────────────────
$search.addEventListener('input', applyFilters);

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  listSource = currentSource;   // the source now actually painted into #main-content
  if (!filtGroups.length) {
    $main.innerHTML = `<div class="state-view"><span>${sourceTitles[currentSource] || 'Aucun élément'}</span></div>`;
    return;
  }

  // Groups — build each day's cells HTML but keep it OUT of the DOM (in
  // _groupCells). The DOM gets empty grids with a reserved height; virtualize()
  // fills only the ones near the viewport. data-idx stays the flat index so the
  // lightbox and selection keep working whenever a cell is (re)mounted.
  let cursor = 0;
  _groupCells = [];
  const groupsHTML = filtGroups.map((g, gi) => {
    const cells = g.items.map(item => {
      const idx = cursor++;
      const vid = item.type === 'video';
      if (item.type === 'audio') {
        return `
        <div class="media-cell audio-cell" data-idx="${idx}">
          ${AUDIO_ICON_SVG}
          <div class="check-circle">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L3.8 7.5L10 1" stroke="#111" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>`;
      }
      return `
        <div class="media-cell" data-idx="${idx}">
          <img src="${thumbUrl(item.path)}" loading="lazy" decoding="async" alt="">
          ${vid ? `<div class="video-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </div>` : ''}
          <div class="check-circle">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L3.8 7.5L10 1" stroke="#111" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>`;
    }).join('');
    _groupCells.push(cells);
    return `
      <div class="date-group" data-date="${g.date}">
        <div class="date-label">${fmtDate(g.date)}</div>
        <div class="media-grid" data-gi="${gi}" data-n="${g.items.length}"></div>
      </div>`;
  }).join('');

  $main.innerHTML = groupsHTML;
  virtualize();
}

// ── Virtualization (windowing by day) ────────────────────────────────────────
// Keep only grids near the viewport populated. Empty grids get a reserved
// min-height computed from column metrics so the scrollbar is correct.
let _groupCells = [];
let _vobs = null;

function _gridHeight(n, cols, cellW, gap) {
  const rows = Math.ceil(n / cols) || 1;
  return Math.round(rows * cellW + (rows + 1) * gap);  // +1 gap ≈ bottom padding
}

function _fillGrid(grid, cols, cellW, gap) {
  if (grid.dataset.filled) return;
  grid.innerHTML = _groupCells[+grid.dataset.gi] || '';
  grid.dataset.filled = '1';
  grid.style.minHeight = '';
  if (selecting && chosen.size) {                      // re-apply selection on remount
    grid.querySelectorAll('.media-cell').forEach(c => {
      if (chosen.has(+c.dataset.idx)) c.classList.add('selected');
    });
  }
}

function _emptyGrid(grid, cols, cellW, gap) {
  if (!grid.dataset.filled) return;
  grid.style.minHeight = _gridHeight(+grid.dataset.n, cols, cellW, gap) + 'px';
  grid.innerHTML = '';
  delete grid.dataset.filled;
}

function virtualize() {
  if (_vobs) { _vobs.disconnect(); _vobs = null; }
  const grids = [...$main.querySelectorAll('.media-grid[data-gi]')];
  if (!grids.length) return;

  // Measure column metrics from a live grid (handles the 2/3/4-col breakpoints
  // and the 600px cap automatically).
  const g0 = grids[0];
  const cs = getComputedStyle(g0);
  const cols = cs.gridTemplateColumns.split(' ').filter(Boolean).length || 2;
  const gap = parseFloat(cs.gap) || 2;
  const cellW = (g0.clientWidth - (cols - 1) * gap) / cols;

  // Reserve height up front so the full scroll length exists immediately
  // (filled grids already have real, content-driven height).
  for (const grid of grids)
    if (!grid.dataset.filled)
      grid.style.minHeight = _gridHeight(+grid.dataset.n, cols, cellW, gap) + 'px';

  // Fill the first few days synchronously so the first screen is never blank,
  // regardless of when the observer's first callback fires.
  for (const grid of grids.slice(0, 8)) _fillGrid(grid, cols, cellW, gap);

  _vobs = new IntersectionObserver(entries => {
    for (const e of entries) {
      const grid = e.target.querySelector('.media-grid[data-gi]');
      if (!grid) continue;
      if (e.isIntersecting) _fillGrid(grid, cols, cellW, gap);
      else _emptyGrid(grid, cols, cellW, gap);
    }
  }, { root: document.getElementById('content'), rootMargin: '1200px 0px', threshold: 0 });

  $main.querySelectorAll('.date-group').forEach(dg => _vobs.observe(dg));
}

// ── Cell interactions (event delegation — bound ONCE on $main, not per cell) ──
// Pointer events unify mouse + touch. A short press = tap (open/select); a
// 480ms hold = enter selection. Movement > 10px = scroll, not a tap.
function setupDelegation() {
  let downCell = null, downX = 0, downY = 0, lpTimer = null, lpFired = false;

  function endPress() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    if (downCell) downCell.classList.remove('tap-flash');
    downCell = null;
  }

  $main.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.media-cell');
    if (!cell) return;                       // stories/empty space: nothing to arm
    downCell = cell; downX = e.clientX; downY = e.clientY; lpFired = false;
    cell.classList.add('tap-flash');
    lpTimer = setTimeout(() => {
      lpFired = true; lpTimer = null;
      cell.classList.remove('tap-flash');
      if (!selecting) enterSelect();
      toggleSel(cell);
    }, 480);
  });

  $main.addEventListener('pointerup', e => {
    const cell = downCell;
    const fired = lpFired;
    endPress();
    if (cell && !fired && e.target.closest('.media-cell') === cell) tap(cell, e);
  });

  $main.addEventListener('pointermove', e => {
    if (downCell && (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10))
      endPress();                            // moved → it's a scroll, cancel
  }, { passive: true });

  ['pointercancel', 'pointerleave'].forEach(ev => $main.addEventListener(ev, endPress));
}

function tap(cell, e) {
  e.preventDefault();
  const idx = +cell.dataset.idx;
  if (selecting) toggleSel(cell);
  else openLb(idx);
}

// ── Selection ────────────────────────────────────────────────────────────────
function enterSelect() {
  selecting = true;
  $main.classList.add('selecting');
  $selBar.classList.add('visible');
}
function exitSelect() {
  selecting = false;
  chosen.clear();
  $main.classList.remove('selecting');
  $selBar.classList.remove('visible');
  $main.querySelectorAll('.media-cell.selected').forEach(c => c.classList.remove('selected'));
  updateCount();
}
function toggleSel(cell) {
  const idx = +cell.dataset.idx;
  if (chosen.has(idx)) { chosen.delete(idx); cell.classList.remove('selected'); }
  else                  { chosen.add(idx);    cell.classList.add('selected'); }
  updateCount();
  if (chosen.size === 0) exitSelect();
}
function updateCount() {
  const n = chosen.size;
  $selCnt.textContent = n <= 1 ? `${n} sélectionné` : `${n} sélectionnés`;
}
$selCancel.addEventListener('click', exitSelect);

// Demo picker: push the current selection to the server (build_demo.py --selection)
const $selDemo = document.getElementById('sel-demo');
if (!DEMO && $selDemo) {
  $selDemo.style.display = '';
  $selDemo.addEventListener('click', async () => {
    const items = [...chosen].map(i => flatItems[i]).filter(Boolean)
      .map(it => ({ source: currentSource, path: it.path }));
    if (!items.length) return;
    try {
      const r = await fetch('/api/demo/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      const d = await r.json();
      $selCnt.textContent = `${items.length} ajouté(s) · ${d.total} dans la démo`;
      setTimeout(exitSelect, 1200);
    } catch (e) {
      $selCnt.textContent = 'Erreur : ' + e.message;
    }
  });
}


async function loadLbMeta(item) {
  const gen = ++_metaGen;
  const $time = document.getElementById('lb-time');
  const $loc  = document.getElementById('lb-loc');
  $time.style.display = 'none';
  $loc.style.display  = 'none';
  try {
    let meta;
    if (DEMO) {
      meta = { datetime: item.datetime, lat: item.lat, lon: item.lon };
    } else {
      const r = await fetch('/api/meta?source=' + encodeURIComponent(currentSource) + '&p=' + encodeURIComponent(item.path));
      if (!r.ok || gen !== _metaGen) return;
      meta = await r.json();
    }
    if (gen !== _metaGen) return;
    if (meta.datetime) {
      const dt = new Date(meta.datetime);
      document.getElementById('lb-time-text').textContent =
        dt.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
      $time.style.display = 'inline-flex';
    }
    if (meta.lat != null && meta.lon != null) {
      const $link = document.getElementById('lb-loc-link');
      $link.href = `https://maps.apple.com/?ll=${meta.lat},${meta.lon}&z=15`;
      // place name comes from the local server (offline geocoding), never an online service
      $link.textContent = meta.place || 'Voir le lieu';
      $loc.style.display = 'inline-flex';
    }
  } catch { /* silent */ }
}

function updateNavArrows() {
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  if (prev) prev.classList.toggle('edge', lbIdx <= 0);
  if (next) next.classList.toggle('edge', lbIdx >= flatItems.length - 1);
}

// ── Lightbox ─────────────────────────────────────────────────────────────────
function openLb(idx) {
  lbIdx = idx;
  $lb.classList.add('opening');
  requestAnimationFrame(() => {
    loadSlide(idx);
    $lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    updateNavArrows();
  });
}
function closeLb() {
  setPlay(false);
  $lb.classList.remove('open');
  $lb.classList.remove('has-video');
  setTimeout(() => {
    $lb.classList.remove('opening');
    const v = $lbSlide.querySelector('video');
    if (v) { v.pause(); v.src = ''; }
    $lbSlide.innerHTML = '';
    $lbSlide.classList.remove('loaded');
    $lbSlide.style.cssText = '';
    document.body.style.overflow = '';
  }, 260);
}
function loadSlide(idx) {
  const item = flatItems[idx];
  if (!item) return;

  $lbSlide.classList.remove('loaded');
  $lbSlide.innerHTML = '';

  const dt = new Date(item.date + 'T12:00:00');
  $lbDate.textContent = dt.toLocaleDateString(LOCALE,
    { day: 'numeric', month: 'long', year: 'numeric' });

  if (item.type === 'audio') {
    $lb.classList.add('has-video');
    const wrap = document.createElement('div');
    wrap.className = 'audio-player';
    wrap.innerHTML = AUDIO_ICON_SVG;
    const a = document.createElement('audio');
    a.src = murl(item.path);
    a.controls = true;
    a.autoplay = true;
    a.addEventListener('loadedmetadata', () => $lbSlide.classList.add('loaded'));
    a.addEventListener('error', () => $lbSlide.classList.add('loaded'));
    wrap.appendChild(a);
    $lbSlide.appendChild(wrap);
  } else if (item.type === 'video') {
    $lb.classList.add('has-video');
    const v = document.createElement('video');
    v.src = murl(item.path);
    v.controls = true;
    v.autoplay = true;
    v.playsInline = true;
    v.style.cssText = 'max-width:100%;max-height:100%';
    v.addEventListener('loadedmetadata', () => $lbSlide.classList.add('loaded'));
    v.addEventListener('error', () => $lbSlide.classList.add('loaded'));
    $lbSlide.appendChild(v);
  } else {
    $lb.classList.remove('has-video');
    const img = new Image();
    img.alt = '';
    img.onload  = () => $lbSlide.classList.add('loaded');
    img.onerror = () => $lbSlide.classList.add('loaded');
    img.src = murl(item.path);
    $lbSlide.appendChild(img);
  }

  $lbDl.onclick = () => {
    const a = document.createElement('a');
    a.href = murl(item.path);
    a.download = item.path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  loadLbMeta(item);
  autoNext();
}

// ── Slideshow: photos stay 4 s, videos and voice notes play to the end ───────
const SLIDE_MS = 4000;
let lbPlay = false, lbTimer = 0;
function setPlay(on) {
  lbPlay = on;
  document.getElementById('lb-play').checked = on;
  autoNext();
}
function autoNext() {
  clearTimeout(lbTimer);
  if (!lbPlay) return;
  const go = () => { if (lbIdx < flatItems.length - 1) navLb(1); else setPlay(false); };
  const m = $lbSlide.querySelector('video,audio');
  if (!m) { lbTimer = setTimeout(go, SLIDE_MS); return; }
  m.addEventListener('ended', () => { if (lbPlay && m.isConnected) go(); });
  m.addEventListener('error', () => { if (lbPlay && m.isConnected) lbTimer = setTimeout(go, 1500); });
  if (m.paused) m.play().catch(() => {});
}

function navLb(dir) {
  const next = lbIdx + dir;
  if (next < 0 || next >= flatItems.length) return;
  lbIdx = next;
  updateNavArrows();

  const outX = dir < 0 ? 60 : -60;
  $lbSlide.style.transition = 'transform 200ms ease,opacity 200ms ease';
  $lbSlide.style.transform  = `translateX(${outX}px)`;
  $lbSlide.style.opacity    = '0';

  setTimeout(() => {
    $lbSlide.style.transition = 'none';
    $lbSlide.style.transform  = `translateX(${-outX}px)`;
    $lbSlide.style.opacity    = '0';
    loadSlide(lbIdx);
    requestAnimationFrame(() => {
      $lbSlide.style.transition = 'transform 240ms ease,opacity 240ms ease';
      $lbSlide.style.transform  = 'translateX(0)';
      $lbSlide.style.opacity    = '1';
    });
  }, 200);
}

// Touch / mouse gestures on lightbox
let lbT0x = 0, lbT0y = 0, lbDrg = false;

$lbWrap.addEventListener('touchstart', e => {
  lbT0x = e.touches[0].clientX;
  lbT0y = e.touches[0].clientY;
  lbDrg = true;
}, { passive: true });

$lbWrap.addEventListener('touchmove', e => {
  if (!lbDrg) return;
  const dx = e.touches[0].clientX - lbT0x;
  const dy = e.touches[0].clientY - lbT0y;
  if (Math.abs(dx) > Math.abs(dy)) {
    e.preventDefault();
    $lbSlide.style.transition = 'none';
    $lbSlide.style.transform  = `translateX(${dx * 0.35}px)`;
  }
}, { passive: false });

$lbWrap.addEventListener('touchend', e => {
  if (!lbDrg) return;
  lbDrg = false;
  const dx = e.changedTouches[0].clientX - lbT0x;
  const dy = e.changedTouches[0].clientY - lbT0y;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
  if (Math.abs(dy) > 90 && Math.abs(dy) > Math.abs(dx)) closeLb();
  else if (Math.abs(dx) > 55) navLb(dx < 0 ? 1 : -1);
}, { passive: true });

// Desktop mouse drag
let lbM0 = 0, lbMDrg = false;
$lbWrap.addEventListener('mousedown', e => { lbM0 = e.clientX; lbMDrg = true; });
$lbWrap.addEventListener('mousemove', e => {
  if (!lbMDrg) return;
  $lbSlide.style.transition = 'none';
  $lbSlide.style.transform  = `translateX(${(e.clientX - lbM0) * 0.3}px)`;
});
$lbWrap.addEventListener('mouseup', e => {
  if (!lbMDrg) return;
  lbMDrg = false;
  const dx = e.clientX - lbM0;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
  if (Math.abs(dx) > 70) navLb(dx < 0 ? 1 : -1);
});
$lbWrap.addEventListener('mouseleave', () => {
  lbMDrg = false;
  $lbSlide.style.transition = '';
  $lbSlide.style.transform  = '';
});

$lbClose.addEventListener('click', closeLb);
document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
document.getElementById('lb-next').addEventListener('click', () => navLb(1));
document.getElementById('lb-play').addEventListener('change', e => setPlay(e.target.checked));

document.addEventListener('keydown', e => {
  if (!$lb.classList.contains('open')) return;
  // space toggles, except where it already acts natively (players, the switch itself)
  if (e.key === ' ' && !e.target.closest('video,audio,input')) { e.preventDefault(); setPlay(!lbPlay); }
  if (e.key === 'ArrowLeft')  navLb(-1);

});

const _cnt = n => n > 999 ? '999+' : ('' + n);
function _bubbleHTML(previewPath, count) {
  return `<div class="bub"><img loading="lazy" src="${thumbUrl(previewPath)}">` +
    (count > 1 ? `<div class="cnt">${_cnt(count)}</div>` : '') + `<div class="pin"></div></div>`;
}

function initMap() {
  if (_map) return;
  _map = L.map('map-view', { worldCopyJump: true, zoomControl: true }).setView([30, 0], 2);
  const esri = (s, o) => L.tileLayer(
    `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`,
    Object.assign({ maxZoom: 18, attribution: '© Esri' }, o || {}));
  // Several basemaps the viewer can switch between (all key-free Esri services).
  const base = {
    'Sombre': L.layerGroup([esri('Canvas/World_Dark_Gray_Base'),
                            esri('Canvas/World_Dark_Gray_Reference', { opacity: .9 })]),
    'Satellite': L.layerGroup([esri('World_Imagery'),
                               esri('Reference/World_Boundaries_and_Places', { opacity: .9 })]),
    'Clair': L.layerGroup([esri('Canvas/World_Light_Gray_Base'),
                           esri('Canvas/World_Light_Gray_Reference', { opacity: .9 })]),
  };
  base['Sombre'].addTo(_map);
  L.control.layers(base, null, { position: 'topright' }).addTo(_map);
  _cluster = L.markerClusterGroup({
    maxClusterRadius: 48, showCoverageOnHover: false, spiderfyOnMaxZoom: false,
    zoomToBoundsOnClick: false,
    iconCreateFunction(c) {
      let best = null, total = 0;
      for (const m of c.getAllChildMarkers()) {
        total += m.spot.items.length;
        if (!best || m.spot.items[0].date > best.items[0].date) best = m.spot;
      }
      return L.divIcon({ html: _bubbleHTML(best.items[0].path, total), className: '', iconSize: [46, 62] });
    }
  });
  _cluster.on('clusterclick', e => {
    const items = [];
    for (const m of e.layer.getAllChildMarkers()) items.push(...m.spot.items);
    items.sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
    flatItems = items; openLb(0);
  });
  _map.addLayer(_cluster);
}

async function loadGeo() {
  const hud = document.getElementById('map-hud');
  try {
    const spots = await getJSON('/api/geo?source=memories', 'geo_memories.json');
    let total = 0;
    for (const s of spots) {
      total += s.items.length;
      const m = L.marker([s.lat, s.lon],
        { icon: L.divIcon({ html: _bubbleHTML(s.items[0].path, s.items.length), className: '', iconSize: [46, 62] }) });
      m.spot = s;
      m.on('click', () => { flatItems = s.items; openLb(0); });
      _cluster.addLayer(m);
    }
    hud.innerHTML = tf('{n} lieux · {t} souvenirs', { n: spots.length, t: total }) +
      '<small>' + t('Les Chat Media n’ont pas de position : ils n’apparaissent pas sur la carte.') + '</small>';
    showMapNotice(spots.length);
  } catch (e) {
    hud.textContent = 'Erreur carte : ' + e.message;
  }
}

const flagEmoji = cc => cc && cc.length === 2
  ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏳️';
const MONTHS3 = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// sequential purple ramp (dark surface → brighter = more)
const CAL_STEPS = ['#ffffff0d', '#3a2a5c', '#5a3f9e', '#7c5fd0', '#a989f5', '#d4bbff'];
function calBucket(n) {
  if (!n) return 0;
  if (n <= 2) return 1; if (n <= 5) return 2; if (n <= 10) return 3; if (n <= 20) return 4; return 5;
}

async function loadStats() {
  $statsView.innerHTML = `<div class="state-view"><div class="spinner"></div><span>${t('Calcul des statistiques… (première fois, ~1 min)')}</span></div>`;
  try {
    renderStats(await getJSON('/api/stats?source=memories', 'stats_memories.json'));
  } catch (e) {
    $statsView.innerHTML = `<div class="state-view"><span>Erreur : ${esc(e.message)}</span></div>`;
  }
}

function fmtFR(d) { return new Date(d + 'T12:00:00').toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' }); }

function renderStats(s) {
  const h = Math.floor(s.videoSeconds / 3600), m = Math.round((s.videoSeconds % 3600) / 60);
  const vidTime = h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;

  // year bars
  const years = Object.keys(s.perYear);
  const ymax = Math.max(1, ...Object.values(s.perYear));
  const yearBars = years.map(y => {
    const n = s.perYear[y];
    return `<div class="col" data-year="${y}" title="${y} · ${n} souvenirs">
      <div class="bar" style="height:${Math.round(n / ymax * 110)}px"></div>
      <div class="xl">${y.slice(2)}</div></div>`;
  }).join('');

  // month bars (seasonality)
  const mmax = Math.max(1, ...s.perMonth);
  const monthBars = s.perMonth.map((n, i) =>
    `<div class="col" title="${['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'][i]} · ${n}">
      <div class="bar" style="height:${Math.round(n / mmax * 64)}px"></div>
      <div class="xl">${MONTHS3[i]}</div></div>`).join('');

  // calendar heatmap, one block per year
  const cal = years.slice().reverse().map(y => {
    const start = new Date(y + '-01-01T12:00:00'), end = new Date(y + '-12-31T12:00:00');
    const pad = start.getDay();                 // leading blanks (Sun=0)
    let cells = '';
    for (let i = 0; i < pad; i++) cells += `<div class="cell" style="visibility:hidden"></div>`;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const iso = d.toISOString().slice(0, 10);
      const n = s.perDay[iso] || 0;
      const hit = n > 0 ? ` hit" data-date="${iso}` : '';
      cells += `<div class="cell${hit}" style="background:${CAL_STEPS[calBucket(n)]}" title="${fmtFR(iso)} · ${n} souvenir${n > 1 ? 's' : ''}"></div>`;
    }
    return `<div class="rt-cal-year"><div class="yl">${y}</div><div class="rt-cal">${cells}</div></div>`;
  }).join('');
  const legend = `<div class="rt-legend"><span>moins</span>${CAL_STEPS.map(c => `<span class="cell" style="background:${c}"></span>`).join('')}<span>plus</span></div>`;

  // top places
  const pmax = Math.max(1, ...s.topPlaces.map(p => p.n));
  const places = s.topPlaces.map(p =>
    `<div class="rt-place"><span class="flag">${flagEmoji(p.cc)}</span>
      <span class="nm">${esc(p.city)}</span>
      <span class="track"><span class="fill" style="width:${Math.round(p.n / pmax * 100)}%"></span></span>
      <span class="v">${p.n}</span></div>`).join('');

  $statsView.innerHTML = `
    <div class="rt-hero">
      <div class="big">${s.total.toLocaleString(LOCALE)}</div>
      <div class="sub">${t('souvenirs')} · ${fmtFR(s.first)} → ${fmtFR(s.last)}</div>
      <div class="sub">${tf('{c} pays · {v} villes', { c: s.countries, v: s.cities })}</div>
    </div>
    <div class="rt-tiles">
      <div class="rt-tile"><div class="n">${s.photos.toLocaleString(LOCALE)}</div><div class="l">${t('Photos')}</div></div>
      <div class="rt-tile"><div class="n">${s.videos.toLocaleString(LOCALE)}</div><div class="l">${t('Vidéos')}</div></div>
      <div class="rt-tile"><div class="n">${vidTime}</div><div class="l">${t('Temps vidéo')}</div></div>
      <div class="rt-tile"><div class="n">${s.countries}</div><div class="l">${t('Pays')}</div></div>
    </div>
    <div class="rt-sec">${t('Par année')}</div>
    <div class="rt-bars" id="rt-years">${yearBars}</div>
    <div class="rt-sec">${t('Saisonnalité (par mois, toutes années)')}</div>
    <div class="rt-months">${monthBars}</div>
    <div class="rt-sec">${t("Calendrier d'activité")}</div>
    ${legend}${cal}
    <div class="rt-sec">${t('Top lieux')}</div>
    ${places}
    <div class="rt-sec">${t('Records')}</div>
    <div class="sub" style="color:#bbb;font-size:13px;line-height:1.7">
      ${t('Jour le plus actif :')} <b>${fmtFR(s.busiestDay.date)}</b> (${s.busiestDay.n} ${t('souvenirs')})<br>
      ${t('Année record :')} <b>${s.busiestYear.year}</b> (${s.busiestYear.n} ${t('souvenirs')})
    </div>`;

  // click a year bar → jump to that year in the gallery
  $statsView.querySelectorAll('#rt-years .col').forEach(col =>
    col.addEventListener('click', () => goToYear(col.dataset.year)));

  // click a calendar day (with memories) → jump to that exact day in the gallery
  $statsView.querySelectorAll('.rt-cal .cell.hit').forEach(cell =>
    cell.addEventListener('click', () => goToDay(cell.dataset.date)));
}

// Scroll the (already-rendered, virtualized) list to a day-group. The group div
// always exists with a reserved height, so the jump lands even before its cells
// mount; then the observer fills it. Retries once while the list is still loading.
function scrollToDay(iso) {
  const scroll = () => {
    const el = $main.querySelector(`.date-group[data-date="${iso}"]`);
    if (!el) return false;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('jumped');
    setTimeout(() => el.classList.remove('jumped'), 1500);
    return true;
  };
  requestAnimationFrame(() => { if (!scroll()) setTimeout(scroll, 250); });
}

function goToDay(iso) {
  document.querySelector('.tab[data-tab="0"]').click();   // switch to Souvenirs (loads memories if needed)
  scrollToDay(iso);
}

// Jump to the newest day of a given year.
function goToYear(y) {
  document.querySelector('.tab[data-tab="0"]').click();
  const g = allGroups.find(g => g.date.slice(0, 4) === y);
  if (g) scrollToDay(g.date);
}

    #lic-modal h2{margin:0 0 10px;font-size:22px}
    #lic-modal p{color:rgba(255,255,255,.65);font-size:14px;margin:0 0 18px;line-height:1.5}
    #lic-modal .lic-btn{display:block;width:100%;font:inherit;font-weight:700;border:0;border-radius:11px;padding:13px;cursor:pointer;margin-top:10px}
    #lic-modal .primary{background:#FFFC00;color:#1a1a00;text-decoration:none}
    #lic-modal .sec{background:#ffffff14;color:#fff}
    #lic-modal .lic-key{display:flex;gap:8px;margin-top:16px}
    #lic-modal input{flex:1;min-width:0;background:#0d0d0d;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:11px;color:#fff;font:inherit}
    #lic-modal .lic-key button{flex:none;width:auto;margin:0;padding:11px 16px}
    #lic-modal .x{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
    #lic-err{color:#ff8d98;font-size:13px;margin-top:10px;min-height:1em}`;
  document.head.appendChild(st);

  const bar = document.createElement('div');
  bar.id = 'lic-bar';
  bar.innerHTML = `<span id="lic-msg"></span><button id="lic-unlock">Débloquer l'illimité</button>`;
  document.body.appendChild(bar);

  const modal = document.createElement('div');
  modal.id = 'lic-modal';
  modal.innerHTML = `<div class="box">
    <button class="x" id="lic-close">×</button>
    <h2>Débloquer Memora</h2>
    <p>Gratuit : <b id="lic-free">100</b> souvenirs. Débloque <b>tout ton export</b>, à vie,
       pour <b>19,99&nbsp;€</b> — paiement unique, aucune donnée ne quitte ta machine.</p>
    <a class="lic-btn primary" id="lic-buy" href="${LS_CHECKOUT}" target="_blank" rel="noopener">Acheter — 19,99 €</a>
    <div class="lic-key"><input id="lic-input" placeholder="Colle ta clé de licence" autocomplete="off"><button class="lic-btn sec" id="lic-activate">Activer</button></div>
    <div id="lic-err"></div>
  </div>`;
  document.body.appendChild(modal);

  async function refresh(){
    try {
      const d = await (await fetch('/api/license')).json();
      document.getElementById('lic-free').textContent = d.freeLimit;
      if (d.pro) { bar.classList.remove('on'); return; }
      const c = d.counts || {}, w = d.waiting || {};
      const shown = ['memories', 'chat'].reduce((s, k) => s + Math.min(c[k] || 0, d.freeLimit), 0);
      const tot = ['memories', 'chat'].reduce((s, k) => s + (c[k] || 0) + (w[k] || 0), 0);
      document.getElementById('lic-msg').textContent = shown < tot
        ? `Version gratuite : ${shown.toLocaleString(LOCALE)} éléments sur ${tot.toLocaleString(LOCALE)}`
        : `Version gratuite : jusqu'à ${d.freeLimit} éléments par catégorie`;
      bar.classList.add('on');
    } catch(e) {}
  }
  document.getElementById('lic-unlock').onclick = () => modal.classList.add('on');
  document.getElementById('lic-close').onclick = () => modal.classList.remove('on');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('on'); };
  document.getElementById('lic-activate').onclick = async () => {
    const key = document.getElementById('lic-input').value.trim();
    if (!key) return;
    const err = document.getElementById('lic-err'); err.textContent = '…';
    try {
      const d = await (await fetch('/api/license/activate', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key })
      })).json();
      if (d.pro) {
        modal.classList.remove('on');
        for (const k in _mediaCache) delete _mediaCache[k];
        _geoLoaded = false; _statsLoaded = false; _tripsData = null;
        if (currentView === 'list') load();
        refresh();
        // the free version only processed 100 items per category: do the rest now
        if (window.memoraImportRemaining) window.memoraImportRemaining();
      } else { err.textContent = 'Clé invalide.'; }
    } catch(e) { err.textContent = 'Erreur : ' + e.message; }
  };
  window.memoraLicenseRefresh = refresh;   // used by the Réglages panel
  refresh();
})();

// ── Réglages: where the data lives, license, version (desktop/local only) ─────
(function settingsUI(){
  if (DEMO) return;
  const btn = document.getElementById('settings-btn');
  btn.style.display = '';
  const appApi = () => window.pywebview && window.pywebview.api && window.pywebview.api.open_path
    ? window.pywebview.api : null;
  const gb = n => (n / 1e9).toLocaleString(LOCALE, { maximumFractionDigits: 1 }) + ' Go';
  const mb = n => n >= 1e9 ? gb(n) : Math.round(n / 1e6).toLocaleString(LOCALE) + ' Mo';

  const st = document.createElement('style');
  st.textContent = `
    #set-modal{position:fixed;inset:0;z-index:940;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82)}
    #set-modal.on{display:flex}
    #set-modal .box{position:relative;background:#17171f;border:1px solid rgba(255,255,255,.12);border-radius:18px;
      padding:24px;max-width:560px;width:100%;max-height:calc(100vh - 40px);overflow:auto;color:#fff}
    #set-modal h2{margin:0 0 4px;font-size:21px}
    #set-modal h3{margin:22px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    #set-modal .x{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
    #set-modal .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
    #set-modal .row:first-of-type{border-top:0}
    #set-modal .k{flex:none;width:130px;color:rgba(255,255,255,.6);font-size:13.5px}
    #set-modal .v{flex:1;min-width:0;font-size:13.5px;word-break:break-all}
    #set-modal .v small{display:block;color:rgba(255,255,255,.5);margin-top:2px;word-break:normal}
    #set-modal .path{font:12.5px/1.45 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
    #set-modal button.s{flex:none;font:inherit;font-size:13px;font-weight:600;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;background:#ffffff18;color:#fff}
    #set-modal button.s.y{background:#FFFC00;color:#1a1a00}
    #set-modal button.s.danger{background:#ff5a5a26;color:#ffb3b3}
    #set-modal .pro{color:#7ee0a0;font-weight:700}
    #set-modal .foot{margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.45)}
    @media(max-width:520px){#set-modal .row{flex-wrap:wrap}#set-modal .k{width:100%}}`;
  document.head.appendChild(st);

  const modal = document.createElement('div');
  modal.id = 'set-modal';
  modal.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <button class="x" id="set-close" aria-label="Fermer">×</button>
    <h2 id="set-title">Réglages</h2>
    <div id="set-body">Chargement…</div>
  </div>`;
  document.body.appendChild(modal);
  const body = modal.querySelector('#set-body');
  const close = () => modal.classList.remove('on');
  modal.querySelector('#set-close').onclick = close;
  modal.onclick = e => { if (e.target === modal) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('on')) close(); });

  const openBtn = p => p && appApi()
    ? `<button class="s" data-open="${esc(p)}">Ouvrir</button>` : '';
  const row = (k, v, action = '') => `<div class="row"><div class="k">${k}</div><div class="v">${v}</div>${action}</div>`;

  function render(d){
    const L = d.license, c = L.counts || {}, w = L.waiting || {};
    const tot = (c.memories || 0) + (c.chat || 0) + (w.memories || 0) + (w.chat || 0);
    const since = L.iat ? new Date(L.iat * 1000).toLocaleDateString(LOCALE, { day:'numeric', month:'long', year:'numeric' }) : '';
    let lic;
    if (L.devBypass) {
      lic = row('Statut', '<span class="pro">Complète</span><small>Débloquée par le mode développeur (MEMORA_PRO=1), pas par une clé.</small>');
    } else if (L.pro) {
      lic = row('Statut', '<span class="pro">Complète, à vie</span>')
          + row('Email', esc(L.email || ''))
          + (L.order ? row('Commande', esc(String(L.order))) : '')
          + (since ? row('Activée le', esc(since)) : '')
          + row('Cet ordinateur', '<small style="margin:0">Retire la clé de cet ordinateur (pour la mettre sur un autre).</small>',
                '<button class="s danger" id="set-deact">Désactiver</button>');
    } else {
      lic = row('Statut', `Version gratuite<small>${L.freeLimit} souvenirs visibles par catégorie, sur ${tot.toLocaleString(LOCALE)}.</small>`,
                '<button class="s y" id="set-unlock">Débloquer</button>');
    }
    body.innerHTML =
      '<h3>Bibliothèque</h3>'
      + row('Emplacement', `<span class="path">${esc(d.library || 'non configurée')}</span>`, openBtn(d.library))
      + (d.diskFree != null ? row('Espace disque', `${gb(d.diskFree)} libres sur ${gb(d.diskTotal)}`) : '')
      + row('Contenu', `${(c.memories || 0).toLocaleString(LOCALE)} souvenirs, ${(c.chat || 0).toLocaleString(LOCALE)} Chat Media`)
      + '<h3>Licence</h3>' + lic
      + '<h3>Fichiers de l’app</h3>'
      + row('Réglages', `<span class="path">${esc(d.configDir)}</span>`, openBtn(d.configDir))
      + row('Miniatures', `<span class="path">${esc(d.cacheDir)}</span><small>${mb(d.cacheBytes)} en cache, recréées si besoin.</small>`, openBtn(d.cacheDir))
      + '<h3>À propos</h3>'
      + row('Version', esc(d.version))
      + row('Site', '<a href="https://memorame.app" target="_blank" rel="noopener" style="color:#FFFC00">memorame.app</a>')
      + '<p class="foot">Tes photos et vidéos restent sur cet ordinateur. Memora ne les envoie nulle part.</p>';

    body.querySelectorAll('[data-open]').forEach(b => b.onclick = () => appApi().open_path(b.dataset.open));
    const unlock = body.querySelector('#set-unlock');
    if (unlock) unlock.onclick = () => { close(); document.getElementById('lic-unlock').click(); };
    const deact = body.querySelector('#set-deact');
    if (deact) deact.onclick = async () => {
      if (!deact.dataset.armed) { deact.dataset.armed = '1'; deact.textContent = 'Confirmer'; return; }
      await fetch('/api/license/deactivate', { method: 'POST' });
      for (const k in _mediaCache) delete _mediaCache[k];
      _geoLoaded = false; _statsLoaded = false; _tripsData = null;
      if (currentView === 'list') load();
      if (window.memoraLicenseRefresh) window.memoraLicenseRefresh();
      show();
    };
  }

  async function show(){
    modal.classList.add('on');
    try {
      const r = await fetch('/api/settings');   // not getJSON: a failure must not flip the app to demo mode
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
    }
    catch(e) { body.textContent = 'Impossible de charger les réglages : ' + e.message; }
  }
  btn.addEventListener('click', show);
})();

// ── Add data (desktop app only): pick export zip(s) → import → refresh ────────
(function importUI(){
  const addBtn = document.getElementById('add-btn');
  if (!addBtn) return;
  // pywebview injects its API asynchronously; reveal the button once it's there.
  function hasApi(){ return !!(window.pywebview && window.pywebview.api && window.pywebview.api.run_import); }
  function reveal(){ if (hasApi()) addBtn.style.display = ''; }
  window.addEventListener('pywebviewready', reveal);
  let tries = 0; const t = setInterval(() => { reveal(); if (hasApi() || ++tries > 40) clearInterval(t); }, 150);

  const st = document.createElement('style');
  st.textContent = `
    #imp-modal{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82)}
    #imp-modal.on{display:flex}
    #imp-modal .box{background:#17171f;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;max-width:520px;width:100%;color:#fff;
      --mp-accent:#FFFC00;--mp-mut:rgba(255,255,255,.55);--mp-ink:#fff}
    #imp-modal h3{margin:0 0 14px;font-size:17px}
    #imp-msg{font-size:14px;line-height:1.5;color:#ffd6d6}
    #imp-msg:empty{display:none}
    #imp-bg{font-size:12.5px;color:rgba(255,255,255,.55);margin:12px 0 0}
    #imp-log{margin-top:10px;background:#000;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;
      font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe;max-height:240px;overflow:auto;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
    #imp-modal [hidden],#imp-pill[hidden]{display:none}
    #imp-modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    #imp-modal button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 15px;cursor:pointer;background:#ffffff18;color:#fff}
    #imp-modal button.primary{background:#FFFC00;color:#1a1a00}
    #imp-modal button.link{background:none;padding:0;margin-top:12px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.55);text-decoration:underline}
    #imp-modal button:disabled{opacity:.5;cursor:default}
    /* small indicator while the import runs with the modal closed: click to expand */
    #imp-pill{position:fixed;right:16px;bottom:72px;z-index:820;width:260px;max-width:calc(100% - 32px);text-align:left;
      background:rgba(23,23,31,.97);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 13px;
      color:#fff;font:inherit;cursor:pointer;box-shadow:0 8px 24px #0009}
    #imp-pill:hover{border-color:rgba(255,255,255,.3)}
    #imp-pill .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
    #imp-pill .t span:last-child{color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
    #imp-pill .b{height:5px;border-radius:99px;background:#ffffff1a;margin-top:8px;overflow:hidden}
    #imp-pill .b i{display:block;height:100%;width:0;background:#FFFC00;border-radius:99px;transition:width .4s}
    #imp-pill.ok .b i{background:#7ee0a0} #imp-pill.fail .b i{background:#ff6b6b}
    #imp-pill small{display:block;margin-top:6px;font-size:11.5px;color:rgba(255,255,255,.5)}`;
  document.head.appendChild(st);
  const modal = document.createElement('div');
  modal.id = 'imp-modal';
  modal.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Ajouter un export Snapchat">
    <h3>Ajouter un export Snapchat</h3>
    <div id="imp-msg"></div>
    <div id="imp-prog" hidden></div>
    <p id="imp-bg" hidden>Tu peux fermer cette fenêtre et continuer à parcourir tes photos : l'import continue en arrière-plan.</p>
    <button class="link" id="imp-logtoggle" hidden>Afficher le détail</button>
    <div id="imp-log" hidden></div>
    <div class="row">
      <button id="imp-copy" hidden>Copier le journal</button>
      <button id="imp-recheck" class="primary" hidden>Revérifier et importer</button>
      <button id="imp-close">Fermer</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  const pill = document.createElement('button');
  pill.id = 'imp-pill'; pill.hidden = true;
  pill.setAttribute('aria-label', 'Import en cours : afficher le détail');
  pill.innerHTML = '<div class="t"><span class="l">Import en cours…</span><span class="p">0 %</span></div><div class="b"><i></i></div><small>Cliquer pour voir le détail</small>';
  document.body.appendChild(pill);

  const q = s => modal.querySelector(s);
  const log = q('#imp-log'), msgEl = q('#imp-msg'), progEl = q('#imp-prog'), bgNote = q('#imp-bg');
  const closeBtn = q('#imp-close'), recheck = q('#imp-recheck'), logToggle = q('#imp-logtoggle'), copyBtn = q('#imp-copy');
  let busy = false, pending = [], prog = null, last = { pct: 0, label: '', status: 'running' }, hideTimer = null;

  // the progress bar is shared with the wizard (progress.js), loaded only in the app
  let progLoaded = null;
  const loadProg = () => progLoaded || (progLoaded = new Promise(res => {
    const sc = document.createElement('script'); sc.src = '/progress.js';
    sc.onload = res; sc.onerror = res; document.head.appendChild(sc);
  }));

  // mirror of the bar, shown when the modal is closed during (or right after) an import
  function paintPill(u){
    last = u || last;
    pill.className = last.status === 'running' ? '' : last.status;
    pill.querySelector('.l').textContent = last.label || 'Import en cours…';
    pill.querySelector('.p').textContent = last.pct + ' %';
    pill.querySelector('.b i').style.width = last.pct + '%';
  }
  const modalOpen = () => modal.classList.contains('on');
  function openModal(){ modal.classList.add('on'); pill.hidden = true; clearTimeout(hideTimer); }
  function closeModal(){
    modal.classList.remove('on');
    if (busy) { paintPill(); pill.hidden = false; }
  }
  pill.addEventListener('click', openModal);

  async function ensureProg(){
    await loadProg();
    if (!prog && window.MemoraProgress) prog = MemoraProgress(progEl, u => { paintPill(u); });
    return prog;
  }

  // New photos show up at the end; on a first import (empty gallery) also as soon as
  // the memories step is over, so there is something to browse while chat media run.
  async function reloadLibrary(){
    try { await Promise.all(['memories', 'chat'].map(s => fetch('/api/refresh?source=' + s))); } catch (e) {}
    for (const k in _mediaCache) delete _mediaCache[k];
    _geoLoaded = false; _statsLoaded = false; _tripsData = null;
    if (currentView === 'list') load();
    if (window.memoraLicenseRefresh) window.memoraLicenseRefresh();
  }

  logToggle.addEventListener('click', () => {
    const show = log.hidden;
    log.hidden = !show; copyBtn.hidden = !show;
    logToggle.textContent = show ? 'Masquer le détail' : 'Afficher le détail';
  });

  function showRunning(){
    if (prog) { progEl.hidden = false; prog.start(); }
    else { log.hidden = false; }   // progress.js unavailable: show the raw log instead
    logToggle.hidden = !prog; bgNote.hidden = false;
    busy = true; paintPill({ pct: 0, label: 'Préparation…', status: 'running' });
  }

  // Refuse to start unless the library's disk has room; let the user free space and re-check.
  async function tryStart(){
    const api = window.pywebview.api;
    recheck.disabled = true; recheck.textContent = 'Vérification…';
    const r = await api.check_space(pending);
    recheck.disabled = false; recheck.textContent = 'Revérifier et importer';
    openModal();
    if (!r.ok){
      msgEl.textContent = '⚠️ ' + r.msg;
      progEl.hidden = true; logToggle.hidden = true; bgNote.hidden = true;
      recheck.hidden = false;
      return;
    }
    msgEl.textContent = ''; recheck.hidden = true;
    await ensureProg();
    log.textContent = '▶ Import de ' + pending.length + ' fichier(s)…';
    showRunning();
    api.run_import(pending);
  }
  recheck.addEventListener('click', tryStart);

  window.onImportLog = function(msg){
    if (msg === '__DONE__' || msg === '__FAIL__'){
      const ok = msg === '__DONE__';
      busy = false; bgNote.hidden = true;
      if (prog) prog.finish(ok); else paintPill({ pct: ok ? 100 : last.pct, label: ok ? 'Import terminé ✓' : 'Import interrompu', status: ok ? 'ok' : 'fail' });
      log.textContent += ok ? '\n✅ Import terminé.' : '\n⚠️ Import interrompu, voir le message ci-dessus.';
      log.scrollTop = log.scrollHeight;
      if (!modalOpen()) {   // tell how it ended; success fades out, a failure stays until clicked
        pill.hidden = false;
        if (ok) hideTimer = setTimeout(() => { pill.hidden = true; }, 8000);
      }
      if (ok) reloadLibrary();
      return;
    }
    if (msg.startsWith('@@STEP chat') && !allGroups.length) reloadLibrary();   // memories ready
    if (prog ? prog.line(msg) : msg.startsWith('@@')) return;   // progress marker
    log.textContent += (log.textContent ? '\n' : '') + msg;
    log.scrollTop = log.scrollHeight;
  };

  // An import started elsewhere (the wizard, before opening the gallery) keeps running:
  // pick it up, modal closed, indicator shown.
  async function resume(){
    const api = window.pywebview && window.pywebview.api;
    if (!api || !api.import_state || busy) return;
    const s = await api.import_state();
    if (!s.running) return;
    await ensureProg();
    q('h3').textContent = 'Import de ton export Snapchat';
    msgEl.textContent = ''; log.textContent = '';
    showRunning();
    for (const l of s.lines) window.onImportLog(l);
    pill.hidden = false;
  }
  window.addEventListener('pywebviewready', resume);
  setTimeout(resume, 1200);

  addBtn.addEventListener('click', async () => {
    if (busy) { openModal(); return; }
    const zips = await window.pywebview.api.pick_exports();
    if (!zips || !zips.length) return;
    pending = zips;
    q('h3').textContent = 'Ajouter un export Snapchat';
    tryStart();
  });

  // Right after unlocking: process what the free tier left in the exports already imported.
  window.memoraImportRemaining = async () => {
    if (!hasApi() || busy || !window.pywebview.api.raw_exports) return;
    pending = await window.pywebview.api.raw_exports();
    if (!pending.length) return;
    q('h3').textContent = 'Import du reste de ta bibliothèque';
    tryStart();
  };
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen()) closeModal(); });
  copyBtn.addEventListener('click', () => {
    try { navigator.clipboard.writeText(log.textContent || ''); } catch(e){}
  });
})();
</script>
